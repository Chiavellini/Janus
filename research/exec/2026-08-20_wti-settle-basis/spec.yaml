status_at_registration: PENDING

# IMMUTABLE AFTER THE FIRST KALSHI MARKET OR SETTLEMENT-SOURCE REQUEST.

purpose: >
  Decide whether NYMEX CL options can hedge a Kalshi WTI binary. This is the gating precondition for
  the project's FOUNDING trade -- arbitraging newly-listed Kalshi commodity markets against real
  options in IBKR -- in the one form of it that is currently unblocked.

why_this_pair_and_not_the_15_minute_one: >
  KXWTI (daily) and KXWTIW (weekly) settle on "the daily settlement price for WTI crude oil
  (<named month> contract)", source ICE WTI Crude Futures (ICE product 213) -- a conventional,
  obtainable reference that options are written on. The 15-minute commodity series instead settle on
  Pyth INDEX feeds (Metal.Index.GOLD/USD, Metal.Index.SILVER/USD, Commodities.Index.PYTHOIL/USD),
  which are NOT on Pyth's public API: of 3,056 Hermes feeds exactly one matches (PYTHOIL) and it is
  142 days stale. So the 15m form is blocked on oracle access while this form is not.

the_question: >
  Kalshi settles on ICE WTI. Option liquidity is overwhelmingly on NYMEX CL (LO options). ICE WTI and
  NYMEX CL are DIFFERENT CONTRACTS -- ICE WTI is cash-settled and tracks CL, but their daily settles
  are not identical by definition. Under the AGENTS.md 2026-08-14 amendment an unmeasured basis is a
  BLOCK, so this difference must be measured before a CL option is ever priced against a Kalshi WTI
  binary.

why_this_is_not_a_test_look: >
  The output is the distribution of a difference between two published settlement values. No PnL, no
  signal, no candidate ranking, no parameter any later strategy selects on. L-row under
  snooping_ledger.md rule 5, same class as L2, L15, L17.

references_and_evidence_tiers:
  kalshi_side:
    field: "expiration_value on settled KXWTI / KXWTIW markets"
    source: "GET https://api.elections.kalshi.com/trade-api/v2 (public, unauthenticated)"
    tier: M1
    note: >
      This is the OPERATIVE number: whatever Kalshi published is what a Kalshi position actually
      settles against, regardless of what ICE's own record says. A separate Kalshi-vs-ICE question
      exists and is explicitly NOT asked here.
  nymex_cl_side:
    sources_pre_declared:
      - "CME Group public settlements endpoint (primary)"
      - "Yahoo per-contract symbol (independent cross-check)"
    tier: R
    note: "Neither is the exchange's own record of account; agreement between two raises confidence only."

CONTRACT_MONTH_MATCHING:
  rule: >
    MANDATORY. Kalshi names the contract month in rules_primary (e.g. "October 2026 contract"). The
    CL series compared MUST be that same delivery month. Comparing against a FRONT-MONTH CONTINUOUS
    series is FORBIDDEN -- a continuous series splices across expiries and its roll days would
    manufacture differences that are pure construction artifact, which is exactly the category error
    the settlement-reference rule exists to prevent. A market whose month cannot be parsed is
    reported MONTH_UNPARSEABLE and excluded, never defaulted to front month.

FORBIDDEN_SUBSTITUTION: >
  No Brent, no spot WTI, no ETF (USO), no Pyth index, no front-month continuous. If no per-contract
  CL settlement source is reachable, the verdict is SOURCE_UNAVAILABLE and the pair stays BLOCK.
  An unreachable source is an ACCESS result, never agreement.

source_integrity_guard: >
  A fetch whose body does not parse as the expected format raises SOURCE_UNPARSEABLE. Zero parsed
  rows from an HTTP 200 is NEVER reported as an empty series (the failure mode L14 hit with stooq).

inclusion_rules:
  series: [KXWTI, KXWTIW]
  status: settled
  market_filter: "rules_primary must state a WTI daily settlement price for a NAMED contract month"
  session_key: "the settlement date named in rules_primary, paired with the parsed contract month"
  per_series_dedupe: >
    One (series, session, expiration_value) per series. Two markets of the SAME series sharing a
    session must agree; a disagreement is a STOP for that (series, session). Disagreement ACROSS
    series is a MEASURED quantity, reported first -- L15 found KXINX and KXINXU disagreeing on 25/39
    shared dates despite identical rules text, so intra-venue agreement is never assumed.
  enumeration_channels: "markets cursor and events with_nested_markets cursor; union; per-channel counts reported"
  truncation_disclosure: "page and market counts reported whether or not the crawl terminates naturally"

coverage_gate:
  min_shared_sessions: 20
  note: >
    Kalshi's settled history reaches back only ~68 days (M1, established by L15/L17/L18 on three
    independent series families). KXWTI is daily, so ~48 sessions are recoverable -- comfortably
    above 20, but the ceiling is real and anything needing longer must be collected FORWARD.
  on_fail: "INSUFFICIENT_COVERAGE; no distribution quoted; pair stays BLOCK"

statistics:
  intra_venue: "KXWTI - KXWTIW on shared sessions: n, fraction exactly equal (2 dp), median, IQR, max_abs"
  external: "kalshi_expiration_value - CL settlement for the SAME month: USD/Bbl and bp; fraction exactly equal; median; max_abs"
  ci: "lib.stats.day_block_ci over the diffs, blocked by settlement date"
  exact_equality: "operationalized at 2 dp -- Kalshi's own rules_secondary states the settlement value is rounded to 2 dp"

verdict_rule:
  EQUIVALENT: >
    n >= 20 AND frac_exactly_equal >= 0.95 AND max_abs <= 0.01. Consequence: NYMEX CL options are a
    valid hedge instrument for Kalshi WTI binaries, and the NYMEX Real-Time (NP,L1) subscription
    ($1.55/mo, waiver-eligible) is the correct purchase.
  WEDGE_MEASURED: >
    Reachable but failing the above. The measured difference becomes the pair's known_basis and any
    CL-based hedge must carry it explicitly. ICE data and ICE options become the alternative.
  SOURCE_UNAVAILABLE: "no per-contract CL settlement source reachable -- an access result"
  immutability: "Fixed now. Not adjusted after seeing any distribution."

not_estimated_here:
  - whether_kalshi_matches_ICEs_own_official_record
  - option_implied_digitals_or_any_edge
  - tick_error_propagation
  - the_pyth_settled_15m_series
  - any_execution_or_fee_modelling

privacy_and_disk:
  identifiers_persisted: none
  raw_rows: "/Volumes/Kilos/janus/wti_basis/ (never the root disk)"
  disk_floor: "abort below 2 GB free on internal /"

outputs:
  results: "research/exec/2026-08-20_wti-settle-basis/results.json"
  verdict: "research/exec/2026-08-20_wti-settle-basis/verdict.md"
