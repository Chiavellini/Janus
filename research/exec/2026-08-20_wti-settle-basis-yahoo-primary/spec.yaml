experiment_id: "janus-track-b-wti-settle-basis-yahoo-primary"
date_registered: "2026-08-19"
track: exec
program: track_b_hft
ledger_ref: "snooping_ledger.md row L20 (descriptive settlement-reference characterization -- costs no test look)"
status_at_registration: PENDING
supersedes: "L19 (research/exec/2026-08-20_wti-settle-basis) -- INSUFFICIENT_COVERAGE, 5 sessions"

# IMMUTABLE AFTER THE FIRST KALSHI MARKET OR SETTLEMENT-SOURCE REQUEST UNDER THIS ROW.

purpose: >
  Same question as L19, with a source design its result licensed: can NYMEX CL options hedge a Kalshi
  WTI binary? This is the gating precondition for the project's founding trade.

what_L19_established_and_why_this_row_exists:
  measured: >
    On all 5 sessions where a per-contract CL settle was obtainable, Kalshi expiration_value = CME's
    own published CL settlement = Yahoo per-contract close, exactly (max|diff| 0.00). Intra-venue,
    KXWTI and KXWTIW agreed on 9/9 shared (session, month) keys.
  the_blocker: >
    CME's public settlements endpoint serves only ~5 recent trade dates ("no settlements array" on 42
    of 47 sessions). Kalshi retains ~68 days. The overlap is about a week wide, so L19 could not
    reach its gate of 20 and STOPPED at INSUFFICIENT_COVERAGE.
  what_changes_here: >
    L19 measured -- did not assume -- that Yahoo's per-contract daily close equals the exchange's own
    settlement on 5/5 sessions. That evidence licenses promoting Yahoo from cross-check to PRIMARY
    per-contract source, which reaches 29 of Kalshi's sessions immediately. CME is retained as the
    exchange-sourced check wherever it still publishes. This is a NEW ROW because L19's sources are
    immutable; promoting a source inside L19 after seeing its result would be criteria drift.

references_and_evidence_tiers:
  kalshi_side: {field: "expiration_value on settled KXWTI/KXWTIW", tier: M1,
                note: "the OPERATIVE value -- what a Kalshi position actually settles against"}
  cl_primary: {source: "Yahoo per-contract chart (e.g. CLV26.NYM)", tier: R,
               justification: "L19 measured 5/5 exact agreement with CME's own settlement"}
  cl_exchange_check: {source: "CME Group public settlements endpoint (product 425)", tier: R,
                      note: "the issuing exchange's own publication; available only for ~5 recent dates"}

CONTRACT_MONTH_MATCHING:
  rule: >
    MANDATORY and unchanged from L19. The CL series compared MUST be the delivery month Kalshi names
    in rules_primary. A FRONT-MONTH CONTINUOUS series is FORBIDDEN: L19 measured the reference rolling
    SEP26 -> OCT26 between 2026-08-14 and 2026-08-17, with CME's SEP settle 84.94 against Kalshi's
    OCT-contract 84.06 on 2026-08-18 -- a continuous series manufactures ~0.9 USD/Bbl of fake basis at
    every roll. A market whose month cannot be parsed is MONTH_UNPARSEABLE and excluded, never
    defaulted.

FORBIDDEN_SUBSTITUTION: >
  No Brent, no spot WTI, no USO, no Pyth index, no front-month continuous. If neither CL source is
  reachable for a session, that session is NO_CL_SETTLE -- counted, never imputed.

KNOWN_COVERAGE_LIMITATION_DECLARED_UP_FRONT: >
  Yahoo delists EXPIRED contracts (JUL 26 and AUG 26 return HTTP 404), so ~27 of Kalshi's older
  sessions are unreachable and are reported as NO_CL_SETTLE. The resulting sample is therefore the
  most RECENT contiguous ~29 sessions, not a random sample of the 68-day window. The Kalshi-vs-CL
  relationship is structural (ICE WTI is cash-settled against NYMEX CL), so time-invariance is
  plausible but NOT established here; any drift older than the covered window is out of scope and
  must not be claimed either way.

inclusion_rules:
  series: [KXWTI, KXWTIW]
  status: settled
  market_filter: "rules_primary must state a WTI daily settlement price for a NAMED contract month"
  session_key: "(settlement date named in rules_primary, parsed contract month)"
  per_series_dedupe: >
    One value per (series, session, month); a within-series disagreement is a STOP for that key.
    Cross-series disagreement is measured and reported, never assumed away.
  enumeration_channels: "markets cursor and events with_nested_markets cursor; union; counts reported"

coverage_gate:
  min_sessions: 20
  on_fail: "INSUFFICIENT_COVERAGE; no distribution quoted; pair stays BLOCK"

statistics:
  intra_venue: "KXWTI - KXWTIW on shared (session, month): n, fraction exactly equal, median, max_abs"
  external: "kalshi - CL settle for the SAME month: USD/Bbl and bp; fraction exactly equal; median; max_abs"
  ci: "lib.stats.day_block_ci over the diffs, blocked by settlement date"
  exact_equality: "2 dp -- the precision Kalshi's own rules_secondary specifies"
  exchange_check: "where CME still publishes, report agreement between Yahoo and CME separately"

verdict_rule:
  EQUIVALENT: >
    n >= 20 AND frac_exactly_equal >= 0.95 AND max_abs <= 0.01. Consequence: NYMEX CL options are a
    valid hedge for Kalshi WTI binaries and NYMEX Real-Time (NP,L1) $1.55/mo is the correct purchase.
  WEDGE_MEASURED: "reachable but failing the above; the difference becomes the pair's known_basis"
  SOURCE_UNAVAILABLE: "no CL settle reachable for any session -- an access result"
  immutability: "Fixed now. Not adjusted after seeing any distribution."

not_estimated_here:
  - whether_kalshi_matches_ICEs_own_official_record
  - option_implied_digitals_or_any_edge
  - tick_error_propagation
  - drift_outside_the_covered_window
  - any_execution_or_fee_modelling

privacy_and_disk:
  identifiers_persisted: none
  raw_rows: "/Volumes/Kilos/janus/wti_basis/ (never the root disk)"
  disk_floor: "abort below 2 GB free on internal /"

outputs:
  results: "research/exec/2026-08-20_wti-settle-basis-yahoo-primary/results.json"
  verdict: "research/exec/2026-08-20_wti-settle-basis-yahoo-primary/verdict.md"
