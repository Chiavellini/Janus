experiment_id: "janus-track-b-btc-ladder-settlement"
date_registered: "2026-08-19"
track: exec
program: track_b_hft
ledger_ref: "snooping_ledger.md row L17 (descriptive settlement-reference characterization -- costs no test look)"
status_at_registration: PENDING

# IMMUTABLE AFTER THE FIRST KALSHI MARKET OR REFERENCE-SOURCE REQUEST UNDER THIS ROW.

purpose: >
  Characterize the KALSHI SIDE of the settlement-map pair KALSHI_BTC_LADDER_vs_CME_BTC_MBT_FUT, in
  the same shape L15 used for the S&P pair. Two questions, reported separately:
    (1) INTRA-VENUE: do KXBTC (hourly range ladder) and KXBTCD (hourly above/below) publish the SAME
        expiration_value for the same strike hour?
    (2) EXTERNAL: does that value match a public CF Benchmarks BRTI reference?
  Reads no quote, computes no strategy return, extracts no implied distribution, and never places a
  Kalshi price next to an IBKR price.

why_question_1_is_asked_first: >
  L14 assumed a settlement date had ONE Kalshi value and STOPPED when it did not; L15 then measured
  that KXINX and KXINXU disagree on 25 of 39 shared dates despite identical rules text and a SHARED
  contract_url. That was on the index pair. Whether the same intra-venue wedge exists on the BTC
  ladders is unknown, cheap to measure, and must be settled BEFORE anything external is compared --
  otherwise "the Kalshi BTC settlement value" is not a well-defined quantity either.

why_this_is_not_a_test_look: >
  The output is the distribution of a difference between published settlement values. No PnL, no
  signal, no candidate ranking, no parameter any later strategy selects on. Registered as an L-row
  under snooping_ledger.md rule 5, same class as L2, L15.

what_this_CANNOT_do: >
  It CANNOT move KALSHI_BTC_LADDER_vs_CME_BTC_MBT_FUT out of BLOCK. That pair is blocked on the
  BRTI-vs-BRR index difference, the futures carry/term-structure component, the binary-vs-linear
  hedge mismatch, and the 17:00-18:00 ET CME crypto halt -- all of which need the IBKR side, which
  this row does not touch. At most this row characterizes ONE HALF of one side. Any claim that the
  pair is measurable after this row is false.

references_and_evidence_tiers:
  kalshi_settlement:
    field: "expiration_value on settled markets"
    source: "GET https://api.elections.kalshi.com/trade-api/v2 (public, unauthenticated)"
    tier: M1
  brti_reference:
    candidate_sources_pre_declared:
      - "CF Benchmarks public API (api.cfbenchmarks.com), ticker BRTI"
      - "CF Benchmarks public API, ticker BRR (DAILY reference rate -- a DIFFERENT index; usable only as a labelled contrast, never as the BRTI value)"
    tier: R
    note: >
      Kalshi settles on a 60 x 1 s BRTI average in the minute before the strike hour (M1, read
      2026-08-19T01:35Z). A per-second historical BRTI series may not be publicly retrievable. If it
      is not, that is an ACCESS result.

  FORBIDDEN_SUBSTITUTION:
    rule: >
      If no BRTI source is reachable, the external half reports SOURCE_UNAVAILABLE and stops. Under
      NO circumstances is exchange spot (Coinbase, Binance, Kraken, an aggregator, or a futures
      price) substituted for BRTI. BRTI is a specific multi-venue index with its own methodology;
      swapping in spot would be precisely the "never compare two prices without first measuring the
      basis between their settlement references" error (AGENTS.md amendment 2026-08-14), and it is
      the same category error that produced phase 1's false "efficient open" result. An unmeasured
      reference is a BLOCK, not an approximation.

source_integrity_guard: >
  A reference fetch whose body does not parse as the expected format raises SOURCE_UNPARSEABLE and
  is reported as such. Zero parsed rows from an HTTP 200 is NEVER reported as an empty series.
  (L14 lost its primary source to exactly this: stooq served a JS anti-bot page as 200.)

inclusion_rules:
  series: [KXBTC, KXBTCD, KXBTCMAXD]
  status: settled
  market_filter: >
    Include a settled market only if its rules_primary states a CF Benchmarks BRTI-derived
    settlement (an average of BRTI seconds before the stated hour). Markets whose rules name a
    different reference are collected, counted, and reported separately, never in a headline.
  strike_hour_key: "close_time, which on these series IS the settlement instant (M1, map v2) -- NOT the date"
  per_series_dedupe: >
    One (series, strike_hour, expiration_value) per series. Two markets of the SAME series sharing a
    strike hour must agree; a disagreement is a STOP for that (series, strike_hour). Disagreement
    ACROSS series is the measured quantity, not an error. This is L15's design, adopted deliberately
    rather than repeating L14's single-value-per-period assumption.
  enumeration_channels: "both the markets cursor and the events with_nested_markets cursor; union; per-channel counts reported"

coverage_gate:
  min_strike_hours: 20
  rule: "Below 20 shared strike hours, report INSUFFICIENT_COVERAGE and quote no distribution. Series are never merged to reach the threshold."

statistics:
  intra_venue: "KXBTC - KXBTCD on shared strike hours: n, fraction exactly equal (2 dp), median, IQR, min, max, max_abs, whether single-signed"
  external: "per series: expiration_value - BRTI reference, absolute and in bp; fraction exactly equal; median; max_abs"
  ci: "lib.stats.day_block_ci over the diffs, blocked by CALENDAR DATE (not strike hour) -- hours within a day share one BTC path and are not independent"

verdict_rule:
  intra_venue:
    AGREE: "n >= 20 AND fraction exactly equal >= 0.95 AND max_abs <= 0.01"
    WEDGE_MEASURED: "otherwise, with the wedge recorded as the pair's intra-venue known_basis"
  external:
    "MATCHES_BRTI": "n >= 20 AND fraction exactly equal >= 0.95 AND max_abs <= 0.01"
    "WEDGE_MEASURED": "reachable but failing the above"
    "SOURCE_UNAVAILABLE": "no BRTI source reachable -- an access result, never agreement"
  pair_status: "UNCHANGED (BLOCK) regardless of outcome; see what_this_CANNOT_do"
  immutability: "Fixed now. Not adjusted after seeing any distribution."

not_estimated_here:
  - the_brti_vs_brr_index_difference
  - futures_carry_or_term_structure
  - binary_vs_linear_hedge_delta
  - the_1700_1800_ET_CME_crypto_halt
  - any_kalshi_price_vs_ibkr_price_comparison
  - which_series_is_correct

privacy_and_disk:
  identifiers_persisted: none
  raw_rows: "/Volumes/Kilos/janus/btc_settlement/ (never the root disk)"
  disk_floor: "abort below 2 GB free on internal /"

outputs:
  results: "research/exec/2026-08-19_btc-ladder-settlement/results.json"
  verdict: "research/exec/2026-08-19_btc-ladder-settlement/verdict.md"
