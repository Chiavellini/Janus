experiment_id: "janus-track-b-phase-a-capture"
date_registered: "2026-08-17"
track: exec
program: track_b_hft
ledger_ref: "snooping_ledger.md row L10 (descriptive characterization -- costs no test look)"
status_at_registration: PENDING

# IMMUTABLE AFTER THE FIRST LIVE COLLECTOR RUN.

purpose: >
  Establish whether authenticated WebSocket episode capture can observe the synchronized open of
  Kalshi's fifteen-minute series without volatility-dependent missingness. This is collection
  characterization only: no return, fill, or strategy parameter is fitted or selected.

why_this_is_not_a_test_look: >
  Phase A measures data availability, clock latency, schema integrity, and operational capture.
  It does not inspect settlement PnL or select a trading rule. Registered as an L-row under
  snooping_ledger.md rule 5.

scope:
  venues: [kalshi, polymarket]
  kalshi_series: "all live series whose series.frequency == fifteen_min"
  expected_kalshi_series_count_prior: 19
  polymarket_scope: "rolling 15-minute equivalents discovered from Gamma; no slug fabrication"
  btc_kilos_episode_data_readable: false
  btc_rule: "Kilos' KXBTC15M episode rows dated 2026-07-21 onward are prior-only and mechanically blocked"
  live_order_placement: false
  credentials: "JANUS_* namespace only; no Kilos credential imports"

sampling:
  trigger: "each UTC quarter-hour boundary"
  required_offsets_s: [0, 0.5, 1, 2, 3, 5, 8, 13, 21, 34, 60]
  sparse_tail_offsets_s: [120, 300, 600]
  timing_fields: [window_open_ts, target_offset_s, receive_ts, exchange_ts, late_by_s]
  missingness_rule: "one explicit capture row per expected series/window/offset, including reason-coded gaps"
  book_rule: "Kalshi YES asks are folded from NO bids; both sides retain raw bid ladders"
  price_units: "YES probability in [0,1]"
  size_units: "contracts ($1 payout units)"

checkpoint:
  duration_h: 72
  min_window_capture_rate: 0.98
  min_series_passing: 12
  max_disk_mb_per_day: 100
  requires_late_by: true
  requires_volatility_conditional_completeness: true
  volatility_measure: >
    Absolute within-window move from one pre-declared public reference series, used ONLY to
    stratify capture missingness: Chainlink for BTC/ETH/SOL/XRP and Pyth for gold/silver/WTI.
    This is not a comparison to a venue price and is not a basis claim. Unsupported reference
    feeds are reported as UNKNOWN and never substituted with a different asset feed.
  volatility_buckets: "fixed global quartiles from all eligible captured reference moves; bucket edges reported"
  alarms_demonstrated_against_fake_target: [liveness, disk_floor, capture_gap]
  on_fail: >
    STOP and re-scope. If authenticated WebSocket capture cannot reach the checkpoint, the
    multi-series question is unanswerable at this access tier. Do not proceed to Phase B.

holdout:
  declaration_timing: "after the 72h checkpoint passes"
  rule: "open_date >= D_seal, with D_seal announced before outcomes are read"
  holdout_touched: false
  requires_user_approval: false

outputs:
  data_db: "/Volumes/Kilos/janus/track_b/episodes.sqlite"
  capture_report: "research/exec/2026-08-17_track-b-phase-a/results.json"
  verdict: "research/exec/2026-08-17_track-b-phase-a/verdict.md"
