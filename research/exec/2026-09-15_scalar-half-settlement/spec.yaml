title: Authoritative non-binary venue settlement and exact held-cover release
status: PENDING

question: >-
  Can Janus represent an authoritative final per-outcome payout when a cancelled market has no
  unique winner, use that payout to settle the exact fully hedged held cover, and preserve every
  existing binary-winner and stopped-lane safety invariant?

