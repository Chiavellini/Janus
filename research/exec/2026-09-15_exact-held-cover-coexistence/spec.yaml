success_criteria:
  - Adversarial fixtures show only the exact registered held cover can coexist; any changed/extra/
    unhedged/open-order/reservation/settlement/outcome-map/marker state blocks.
  - Original L133 all-quiet tests remain green and cannot invoke held-cover semantics accidentally.
  - Shell tests prove L136 SETTLED uses original L133, WAIT uses only L138, and any other L136 exit
    stops before guards, resolution, archive or restart.
  - Ledger/restart tests prove the full reservation still consumes current caps and later ordinary
    authoritative settlement releases it exactly once.
  - Focused and integrated suites, Bash/Python checks and exact replay parity pass; independent Luna
    audit returns RELEASE before production.

