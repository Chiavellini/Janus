question: >-
  Can the exact two-source guard latch be resolved and F22 restarted while retaining this one exact
  fully hedged cover and all of its capital accounting, without allowing any unknown, unhedged,
  extra, mismatched, open-order, unresolved-provider, or otherwise nonquiet state?

required_behavior:
  compatibility:
    - Original L133 prove/activate commands and zero-money quiet semantics remain unchanged.
    - The exact-held path is distinct and reachable only after L136 returns its explicit WAIT code 3.
  exact_cover:
    - Require the complete L138 release SHA, exact retained kill bytes and exact cover identity,
      opportunity, event slug/outcome map, two owned filled closed IOC orders, prices, fees,
      zero unhedged/unwound quantity, open exact reservation and no settlement row.
    - Require no other unreleased execution, reservation, open/unconfirmed/pending order, admission,
      post-only violation/order, or unresolved material flag except registered GUARD_FAILED 1169/1170.
    - Never mark the cover settled, release/shrink its reservation, remove a position, or manufacture
      a venue result.
  guards_and_activation:
    - Require two stopped-lane credentialed complete-quiet guards around the retained-kill three-stream
      warm-up; both must read both venues completely and match the exact expected positions.
    - Re-prove exact held state immediately before exact joint flag resolution and again before
      exclusively archiving only the unchanged kill.
    - Any new evidence, provider error, mismatch, extra state, partial result, process-state failure,
      write/archive/restart failure restores/retains the kill and leaves the lane stopped.
  running_state:
    - After restart the existing ledger must reload the reservation and count its full $24.49357
      against every current limit; the lane's existing settlement pass continues authoritative polls.
    - F22's unchanged first-three-fill gate, assignment, caps, hurdles, sizing, hedge and protection
