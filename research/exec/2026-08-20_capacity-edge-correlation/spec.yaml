experiment_id: "janus-capacity-edge-correlation"
date_registered: "2026-08-20"
track: exec
program: cross_venue_kalshi_pm
ledger_ref: "snooping_ledger.md row L25"
test_looks_spent: 1        # THE PROJECT'S FIRST. Operator-authorised 2026-08-20.

# IMMUTABLE AFTER REGISTRATION. Criteria are frozen BEFORE the statistic is computed.

question: >
  Among verified Kalshi<->Polymarket pairs, is apparent cross-venue edge SMALLER in the markets that
  carry the most executable size? If it is, the capacity measured on 2026-08-20 is unreachable: the
  top decile holds 46% of all transactable dollars, and an edge that lives only in the thin tail
  cannot be traded at scale.

what_this_does_and_does_not_establish:
  does: "whether APPARENT edge co-varies with executable size, at a single point in time."
  does_NOT: >
    It reads NO outcome and NO settlement. It therefore does not establish that any edge is real,
    harvestable, or persistent. A positive result here would mean 'edge is not anti-correlated with
    size', which is a necessary condition for the trade, never a sufficient one.

prior_exposure_disclosure:      # honesty requirement; weakens any claim of a clean first look
  fact: >
    Earlier on 2026-08-20, in the same session, match/screen.py was run over this same corpus and its
    nominal-edge DISTRIBUTION was observed (1,046 of 1,834 pairs at >= 2c; p10 -6.8, p50 +5.4,
    p90 +80.5, max +96.7) and the top hits were inspected and found to be artifacts.
  consequence: >
    This is NOT a virgin look at the edge variable. No criterion below was chosen with reference to
    those numbers -- the capacity variable had not been computed when they were seen, and the
    hypothesis comes from a microstructure argument, not from the distribution. It is recorded
    because a reader must be able to discount it.

population:
  unit: "one UNIQUE Kalshi market (never one pair). A single Kalshi market appears in up to 8 pairs;
         summing per pair triple-counted capacity earlier today ($131,099 vs the correct $38,918)."
  source: "data/match_2026-08-20/verified_candidates.json -- pairs surviving match/verify.py"
  inclusion: "both legs quoted two-sided in the LIVE book pull; markets failing either leg are
              excluded and COUNTED, never silently dropped"

variables:
  capacity_usd: >
    min(kalshi_touch_usd, pm_touch_usd) -- the BINDING leg, since a two-leg trade cannot exceed its
    thinner side. Each leg is size-at-touch x price, from a live book pulled in one pass.
  edge_cents: >
    match/screen.py nominal_edge_cents at EXECUTABLE prices with PER-MARKET fees. Where a market has
    several pairs, its edge is the MAX across them -- the best opportunity that market offers.
    Mid-price scoring is forbidden: it produced phase 1's 47c ghost and L21's 24 fictional arbitrages.

primary_test:
  statistic: "median(edge_cents | top capacity decile) - median(edge_cents | bottom 90%)"
  method: "two-sided permutation test, 10,000 shuffles of the decile label, seed 0"
  significance: "p < 0.004  (BH-FDR q=0.10 over m=25 ledger rows)"

secondary_test:
  statistic: "Spearman rank correlation rho(capacity_usd, edge_cents) across the whole population"
  method: "two-sided permutation test, 10,000 shuffles, seed 0"
  significance: "same 0.004 bar"

robustness_precommitted:        # reported REGARDLESS of the primary outcome
  cut: "repeat both tests on |edge_cents| <= 20"
  why: >
    match/screen.py's own docstring: 'A large nominal edge on an unverified pair is a red flag, not
    an opportunity: it usually means the two markets are NOT the same question.' False pairs
    manufacture huge apparent edges AND are expected to concentrate in THIN markets, whose wide
    spreads produce larger apparent gaps. That confound would manufacture precisely the negative
    correlation this row tests for, so the trimmed result is part of the registered output.

decision_rules:                 # frozen before the statistic is computed
  significantly_negative: >
    HAZARD CONFIRMED. Edge lives where size does not; the measured capacity is not reachable and the
    cross-venue program should not be scaled on it.
  not_significant: >
    NO EVIDENCE of the hazard AT THIS POWER. Explicitly not proof of absence -- n and the unmeasured
    verifier precision both bound what this can say.
  significantly_positive: >
    Edge concentrates where size is. The favourable case, and still only a necessary condition.

known_limitations_stated_before_the_run:
  verifier_precision_unmeasured: >
    match/gold/nonsports.csv is UNLABELLED, so the share of false pairs in the population is unknown.
    This is the largest single threat to the result and cannot be resolved inside this row.
  single_snapshot: "one point in time; says nothing about persistence."
  no_outcomes: "no settlement is read, so no PnL claim of any kind is available from this row."

outputs:
  results: "research/exec/2026-08-20_capacity-edge-correlation/results.json"
  verdict: "research/exec/2026-08-20_capacity-edge-correlation/verdict.md"
