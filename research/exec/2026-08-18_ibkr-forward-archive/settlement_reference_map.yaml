# Settlement-reference map — Track B IBKR program.
# RULE (AGENTS.md amendment 2026-08-14): never compare two prices without first measuring the basis
# between their settlement references. An UNMEASURED basis is a BLOCK, not zero.
#
# Evidence labels: R = researched from published rules/specs (not verified against a live rulebook
# fetch in this pass unless stated), M1 = measured directly by Janus, U = unknown.
# Status vocabulary: BLOCK (basis unmeasured or mismatch unresolved), MEASURING (archive running,
# basis period open), OK (basis measured over the stated period), OK_FOR_<X>_ONLY (measured, and it
# holds only for the named instrument -- the block survives for everything else in the pair).
#
# Every entry below was BLOCK at v2. At v3 exactly one has moved: the SPX pair is OK for the
# NAMED series KXINX and remains BLOCK for KXINXU and for any unnamed-series comparison.

version: 8
date: "2026-08-19"
changelog:
  v8: >
    FIRST PAIR TO CLEAR ON THE PROJECT'S ACTUAL OBJECTIVE. Adds the commodity pair
    KALSHI_KXWTI_vs_NYMEX_CL_OPTIONS, measured OK by L20: Kalshi's KXWTI settles on exactly the NYMEX
