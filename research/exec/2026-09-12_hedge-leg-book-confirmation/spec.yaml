row: L85
date: 2026-09-12
kind: descriptive_execution_repair
status_at_registration: PENDING
observed_failure: >-
  L77 confirms the price the lane is about to PAY and nothing confirms the price it relies on to get
  OUT, so the lane can open a position against a hedge that has already walked away. The
  hedge-capacity precheck that would catch it (grid._hedge_capacity_ok) is gated behind
  plan.first.post_only and the maker path is not live, so on the taker path it never runs.
  64d6925e (2026-09-12 18:58Z, ATP Challenger DJERE v MARTINEZ, the first cover after the operator
  cleared the kill at 18:47Z): plan Polymarket buy_yes 25 @ 0.54 + Kalshi buy_no 25 @ 0.41, a 0.95
  all-in against max_cost 0.995 and a planned +1.35 %. The Kalshi NO side was at 0.51 when the hedge
  fired 0.2 s later, break-even was 0.4233, and the protection layer paid 0.51 because a capped loss
  beats a naked leg: "25.0 hedged @ 0.51 ABOVE_BREAK_EVEN 0.4233: a locked loss inside the cap,
  still a cover", settled realized -1.9979 USD, 87 % of the 2.50 per-execution allowance. The walked
  rung of the ladder was also a known miss the entry read had already measured, costing a submit and
  ~355 ms (walked 0.41 UNFILLED at t=0.211, loss_cap 0.51 FILLED at t=0.566).
immutable_success_criteria:
  - Before an immediate (non-post-only) first-leg send, the coordinator reads the HEDGE leg's book
    once through fresh_book and declines the entry (BOOK_MOVED, reservation released, nothing sent)
    when the walked VWAP for the authorized hedge size is above the hedge's break-even, or when the
    book lacks depth for that size. At or under break-even the send is unchanged -- including above
    the hurdle budget, which still makes money (MORIYA 98376aa2 hedged 0.04 against a 0.0342 budget
    and a 0.0442 break-even for +1.44 %). A failed read is not a verdict. Proven by tests.
  - The comparison is a VWAP against a VWAP threshold (plan.vwap_for_size, walking the ladder), not
    marginal_price against it, so a cover whose average is inside break-even is not refused.
  - The read's cost is recorded as stages_json b_confirm_ms and its observation as protect_json
    hedge_leg_confirm (vwap, marginal, budget, break_even, contracts, first_paid_assumed, at_mono).
  - The protection layer does not spend a walked send the entry reading already says will miss: when
    that reading is younger than ProtectLimits.entry_book_trust_s and its marginal price is above the
    walked ceiling, the walked phase is skipped (attempt logged state=SKIPPED,
    skip=entry_book_above_walked) and the budget phase prices from its own fresh book. A reading
    older than the window, or entry_book_trust_s = 0, restores the pre-L85 sequence, so the guard's
    re-run (protect_existing, whose row can carry a minutes-old observation) never skips on it.
  - Outcome to evaluate after 50 attempts: BOOK_MOVED share attributable to the hedge leg, median
    b_confirm_ms, b_attempts p50/p90 (baseline 3/6), and how many covers settle ABOVE_BREAK_EVEN
    (baseline 8 of 15 losing money in the 7 days to 2026-09-12).
expected_ev_effect: >-
  declines entries whose hedge is already gone, instead of opening them and paying the loss cap to
  close them; removes one wasted hedge submit and its poll interval when the entry read already
  proved the walked rung dead. No cap, hurdle, allowance, ceiling or size moves: the gate only
  refuses an entry, exactly as L77 already refuses one, and the skip can only remove a send the
  ladder would have made at a price it was already permitted.
prohibited:
  - Gating on the walked limit or on the hurdle budget instead of break-even; both refuse covers
    that still make money.
  - Using marginal_price where the threshold is an average.
  - Trusting an entry observation past entry_book_trust_s, or on a guard re-run.
  - Any change to the loss cap, the ladder's ceilings, or what the layer may pay once a position
    exists. The layer's preference for a capped loss over a naked leg is unchanged and correct.
