experiment_id: "janus-newborn-cross-venue-capture"
date_registered: "2026-08-20"
track: exec
program: cross_venue_kalshi_pm
ledger_ref: "snooping_ledger.md row L24 (capture characterization -- costs no test look)"
depends_on: >
  match/verify.py (the equivalence stage that match/block.py:7 and match/screen.py:10 both specify
  and that had never been written). Its blind gate is match/gold/nonsports.csv.

# IMMUTABLE AFTER THE FIRST PERSISTED SNAPSHOT.

purpose: >
  Capture Kalshi and Polymarket order books for markets in the FIRST HOURS OF THEIR LIFE, on both
  venues, together with the birth times that define that window. This row registers the CAPTURE
  ONLY. Its gate is operational -- coverage, staleness, reason-coded gaps, privacy, disk. It draws
  NO conclusion about whether a tradeable gap exists.

why_newborns:
  measured_on_existing_data: >
    From the 12,684-market research/mentions/kalshi_tape.jsonl, whose features are taken at fixed
    offsets from market OPEN by construction: median time from open to first trade is 2.0 h
    (p25 0.6 h, p75 7.2 h, p90 16.3 h). Share still carrying no traded price: 94.8% at t+5min,
    86.4% at t+15min, 76.9% at t+30min, 63.6% at t+1h, 49.7% at t+2h, 28.1% at t+6h.
  consequence: >
    Every previous cross-venue screen in this project sampled MATURE markets from a snapshot. A
    dislocation living in a market's first hours is invisible to that design. This is a cleaner
    explanation of phase 1's central negative than venue efficiency -- and phase 1's negative was
    already conceded in AGENTS.md to rest on "n=35 title-matched pairs ... a matcher limit, not a
    venue fact", against a live universe measured 2026-08-20 at 95,852 Kalshi / 179,863 PM markets.
  consistent_with_inherited: >
    AGENTS.md records the paid-for Kilos findings that Kalshi leads PM by 5-10 s, that 36% of
    >=10 bps jumps are unrepriced within 60 s, that the edge is one-directional ("truth sits at
    Kalshi"), and that at-open is roughly double mid-window (+8.71c/trade at open, n=180, vs
    +4.447c on the registered mid-window rule).

what_is_captured:
  births: "venue, market_id, event_id, title, created_ts, detected_ts, detection_lag_s, close_ts,
           category, first_seen_slot, seeded"
  books: "per followed market per slot: best bid/ask, sizes, spread, level counts, two_sided, and
          the raw top-of-book levels as stored JSON so every derived field can be re-checked"
  money_axis: >
    On EVERY book row: bid_depth and ask_depth (total resting size, free from the book already
    fetched), plus venue volume, volume_24h, open_interest and liquidity, plus days_to_close.
    Stored CUMULATIVE and raw; deltas are derived in analysis, never trusted from the collector.
    Measured availability 2026-08-20: Kalshi supplies volume/volume_24h/open_interest (the `_fp`
    fields; the bare `volume`/`open_interest` keys exist but return null) and PM supplies
    volumeNum/volume24hr/liquidityNum. PM does not expose openInterest; Kalshi's liquidity_dollars
    reads 0. Depth is available on both and is the only money reading that exists on a market with
    zero traded volume -- which is precisely the newborn state.
  pairs: "kalshi_ticker <-> pm_condition_id links with the verify.py reason that admitted them"
  cycles: "one row per scheduled slot per lane -- ok or reason-coded"

books_not_tapes: >
  The tape result above measures the absence of TRADES. Absence of a print is NOT absence of an
  executable quote; a maker may be quoting into silence. That distinction is the entire question, so
  this collector records the ORDER BOOK on both venues and never infers a price from a trade.

cadence_and_scope:
  discovery_period_s: 900
  follow_period_s: 60           # young tier tick
  sweep_period_s: 300           # coarser grid for the rest of the newborn window
  young_s: 1800                 # under 30 min old -> polled every tick
  follow_window_s: 21600        # 6 h
  follow_max_markets: "derived per lane: period_s * 4 req/s * 0.4 duty"
  rationale: >
    The quantity being measured is the PROBABILITY SWEEP -- how price moves as capital arrives -- so
    the grid must RESOLVE the sweep, not merely bracket it. Measured in the 2026-08-20 dry run, one
    PM market's ask went 0.99 -> 0.99 -> 0.99 -> 0.20 -> 0.05 between age 148 s and 681 s: the whole
    adjustment happened inside ~4.5 minutes, which a flat 5-minute grid samples about three times.
    Markets under young_s are therefore polled every 60 s and the rest on the 300 s grid. The cap is
    derived from the slot it must fit inside so a lane can never queue more requests than it has
    room for. The money-axis lookups are BATCHED (both venues accept a multi-id query), so they cost
    ~n/50 requests per slot rather than n.
  age_is_the_coordinate: >
    The sweep is indexed on AGE SINCE BIRTH, not calendar time and not time-to-resolution, because
    the phenomenon is price discovery as capital arrives rather than anything about the event.
    days_to_close is recorded on every row as a COVARIATE precisely so the two can be separated --
    a market born three days before it resolves need not behave like one born three months out.
  scope: "non-sports (operator decision 2026-08-20). Sports has a working canonical-key matcher in
          match/sports_match.py; non-sports had no matcher at all."
  fast_lane_excluded: >
    The ~5 s at-open window measured on KXBTC15M (spread 24c -> 2c by +5 s, +4.10c/fill, n=3,196) is
    R3's mechanism. JANUS_CHECKLIST.md:98 requires coordination with Kilos before either project
    spends that evidence, and that is UNSETTLED. Excluded here deliberately, not overlooked.

cold_start_rule:
  rule: >
    The first discovery pass on a venue records every market it sees as `seeded=1`, NOT as a birth,
    and seeded markets never enter the follow cohort. Measured on the first live run: a cold start
    sees 95,811 Kalshi + 4,474 PM markets, none of which is an observed birth.
  why: "Treating pre-existing markets as newborns both queues a ~100k-request cycle and pollutes the
        cohort with markets of unknown age, which would corrupt the age axis this row exists to
        measure."

denominator_and_gap_rules:
  rule: "every scheduled slot writes exactly one cycle row per lane -- ok or reason-coded. Every
         followed market writes exactly one book row per slot, quoted or reason-coded. No silent
         absences."
  gap_reasons: [KALSHI_ERROR, KALSHI_EMPTY, PM_ERROR, PM_EMPTY, NO_COUNTERPART, VERIFY_REJECTED,
                BOOK_ERROR, DISK_FLOOR, MARKET_CLOSED, UNKNOWN]
  no_silent_caps: "when the follow cohort exceeds follow_max_markets the excess is REPORTED as a
                   COHORT_TRUNCATED health row. A bounded cohort must never read as full coverage."

privacy_and_disk:
  identifiers_persisted: none
  denylist_is_shape_based: >
    The denylist matches identifier SHAPES, not English words. Measured on the live Kalshi book, a
    bare `secret` rejected 83 legitimate markets -- every "next Secretary General of NATO" contract
    -- and a bare `session` would reject any market about a legislative session. A denylist that
    fires on ordinary titles gets loosened in a hurry by whoever hits it.
  db: "<data volume>/newborn/forward.sqlite -- never the root disk"
  disk_floor: "abort below 2 GB free"

host:
  deploy: "VPS (operator decision 2026-08-20)"
  why: >
    Kalshi and Polymarket are public HTTP with NO IBKR gateway dependency, so nothing binds this to
    the Mac -- which is this project's largest single cause of collector death (load avg 64, swap
    8.7/10 GB, root disk at 607 MB free on 2026-08-20, two collectors killed that day).
  launchd_lessons_if_run_locally: >
    ProcessType Interactive, no Nice/LowPriorityIO (Background QoS broke two earlier jobs), and the
    log redirect lives in the runner .sh, because a gui LaunchAgent cannot create StandardOutPath on
    an external volume and fails EX_CONFIG(78) before exec with no logs to explain itself.

checkpoint:
  duration_min_sessions: 10
  criteria:
    - "at least 10 distinct capture sessions"
    - ">= 90% of scheduled slots produce a cycle row in each lane; zero silent absences"
    - "every followed market has exactly one book row per slot it was in the cohort for"
    - "both venues' books timestamped, with recv_ts recorded on every quoted row"
    - "births carry created_ts and detection_lag_s wherever the venue exposes a creation time"
    - "seeded and observed-birth rows stored distinguishably; zero seeded rows in any cohort"
    - "zero identifiers persisted (denylist scan == 0)"
    - "disk consumption measured and <= 50 MB/day"
    - "any COHORT_TRUNCATED events reported with counts"
  on_fail: >
    STOP and report which criterion failed. A capture failure is NEVER reinterpreted as an edge
    result, and the collector is not widened to work around it.

analysis_is_deliberately_not_registered_here: >
  The question the data will answer -- "does an executable, fee-surviving gap between the two venues
  appear at birth, and how often" -- is close in kind to L12 and to R3. Spending the project's first
  numbered test look is the operator's decision and must not arrive as a side effect of starting a
  collector. It gets its own row, after the operator chooses L-row versus numbered AND after the
  Kilos R3 coordination is settled.

outputs:
  results: "research/exec/2026-08-20_newborn-capture/results.json"
  verdict: "research/exec/2026-08-20_newborn-capture/verdict.md"
