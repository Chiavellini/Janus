immutable_success_criteria:
  - For each execution, a timeline from the journal (executions, execution_transitions, orders,
    order_events, venue_fills) with the frozen-book plan, the first-leg submit and settled-ack
    instants, every hedge submission's price, quantity, submit and ack instants and venue answer,
    and the protective walk, all read-only from the box's database.
  - The hedge quote age at each IOC submission (seconds from the plan's books_json stamp or the
    last Kalshi book update the journal carries) and the ask the venue actually filled at, so
    the slippage is attributed to book movement between plan and first-leg fill, or between
    hedge attempts, or to the venue's FIFO at an unchanged touch.
  - A verdict on whether first-leg venue ordering, a smaller initial quantity, or a different
    bounded hedge schedule would have changed the realized result of THESE two executions, stated
    with the expected EV and tail-risk effect of each; no change is proposed that removes or
    delays protective hedging once a first leg is filled.
  - No profitability gate, cap, hurdle or hedge schedule is changed by this row; any candidate
    change is a separate pre-registered row.
expected_ev_effect: >-
  none from this row; it is a description. A later schedule change may reduce realized hedge
  slippage on the ~10 % of attempts that fill the first leg; it cannot lower the two-leg
  requirement.
prohibited:
