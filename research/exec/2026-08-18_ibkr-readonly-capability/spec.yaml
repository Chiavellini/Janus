experiment_id: "janus-track-b-ibkr-readonly-capability"
date_registered: "2026-08-18"
track: exec
program: track_b_hft
ledger_ref: "snooping_ledger.md row L13 (descriptive capability characterization -- costs no test look)"
status_at_registration: PENDING

# IMMUTABLE AFTER THE FIRST CONTRACT-SEARCH OR MARKET-DATA REQUEST.

purpose: >
  Establish whether the live-account IBKR Client Portal session can safely provide genuinely
  real-time hedge-instrument quotes for the Track-B research program. This probe measures API
  capability, entitlements, timestamps, and observable quote fields only. It reads no outcomes,
  computes no strategy return, selects no alpha parameter, and places no order.

why_this_is_not_a_test_look: >
  Contract discovery and feed-entitlement status determine whether an investigation is measurable.
  They contain no PnL, settlement outcome, signal, or candidate ranking. Registered as an L-row
  under snooping_ledger.md rule 5.

safety_gate:
  transport: "lib/ibkr_readonly.py"
  base_url: "https://localhost:5055/v1/api only"
  redirect_policy: "deny"
  tls_exception: "self-signed certificate accepted only after HTTPS loopback validation"
  allowed_http:
    - "GET /tickle"
    - "GET /iserver/accounts"
    - "POST /iserver/auth/status with exact body {}"
    - "GET /iserver/secdef/search"
    - "GET /iserver/secdef/strikes"
    - "GET /iserver/secdef/info"
    - "GET /trsrv/futures"
    - "GET /iserver/marketdata/snapshot"
  allowed_websocket: ["smd top-of-book subscribe", "umd top-of-book unsubscribe"]
  forbidden: >
    All order, cancel, modify, reply, trade, portfolio, PnL, balance, account-management,
    scanner, historical, and unrecognized endpoints/topics. Live price-ladder websocket access
    remains blocked until its current protocol is separately pinned and tested.
  pass_criterion: "all hermetic safety tests pass; any fail is STOP"

session_gate:
  required: {authenticated: true, connected: true, competing: false}
  account_mode: "record live vs paper as a boolean only; never archive an account id"
  on_fail: "BLOCKED_SESSION; make no security or market-data request"

instrument_families:
  crypto_futures:
    discovery_roots: [BTC, MBT]
    role: "tradeable hedge/access instrument, never a prediction-venue leg"
  fed_funds:
    discovery_roots: [ZQ]
    role: "low-prior FOMC-ladder carve-out"
  index_options:
    underlyings: [SPX, XSP]
    role: "0DTE/near-expiry hedge and volatility-surface access"

selection_rules:
  futures: >
    For each root, choose the earliest unexpired returned contract. If expiry cannot be parsed,
    report UNKNOWN and do not substitute another root beyond the registered list.
  index_options: >
    Search the exact underlying symbol as secType IND. Select the earliest non-expired option
    month exposed by that response. Request strikes, then select the strike nearest the observed
    underlying last price; ties choose the lower strike. Validate one call and one put at that
    exact month/strike. If an exact expiration day cannot be pinned from the returned contract,
    label it NEAR_EXPIRY_UNRESOLVED, not 0DTE.
  market_data_fields: [31, 55, 84, 85, 86, 88, 6004, 6008, 6070, 6073, 6119, 6509]
  snapshot_protocol: "one pre-flight request, wait at least 1 second, then one measured request"

entitlement_rules:
  source_field: 6509
  realtime_prefix: R
  delayed_prefix: D
  frozen_prefixes: [Z, Y]
  not_subscribed_prefix: N
  incomplete_agreement_prefix: O
  rule: >
    Only an R-prefixed availability code is HFT_READY. D/Z/Y/N/O and missing codes are blocked
    for HFT inference. A blocked family is an access finding, never evidence against an edge.

checkpoint:
  mandatory_safety_pass: true
  mandatory_session_pass: true
  family_outputs: [crypto_futures, fed_funds, index_options]
  program_ready_rule: >
    At least one crypto future and at least one SPX/XSP option contract must be HFT_READY for
    IBKR-dependent cross-asset investigations. Fed-funds readiness is reported independently and
    does not block the volatility program.
  on_fail: >
    STOP only the IBKR-dependent family that failed. Preserve the existing Kalshi/Polymarket
    collector and do not reinterpret missing or delayed IBKR data as a null result.

privacy:
  raw_account_response_persisted: false
  archive_account_ids: false
  archive_session_tokens: false
  archive_user_ids: false
  archive_mac_addresses: false

outputs:
  results: "research/exec/2026-08-18_ibkr-readonly-capability/results.json"
  verdict: "research/exec/2026-08-18_ibkr-readonly-capability/verdict.md"

