question: >-
  Can a stopped-lane, retained-kill helper use the existing venue-authoritative settlement functions
  to settle only this exact fully hedged cover, while correcting L133's admission and historical
  violation predicates without weakening any current-order or current-role safety check?

required_behavior:
  exact_target:
    - require the full deployed release SHA, exact retained kill bytes, inactive unit and both PIDs zero
    - require exactly one unreleased execution/reservation and exact equality to the identity and economics above
    - require both owned orders filled, closed, confirmed and fee-complete; reject any other order or settlement row
  settlement:
    - fetch each venue's winner through nodes.reconcile.settle_executions.fetch_results, never a price or midpoint
    - write nothing unless both venues are final and return exactly one winner belonging to the registered event outcomes
    - apply through the existing apply_settlements and ExposureLedger path, not direct UPDATE statements
    - require one released COVER settlement, 25 hedged, zero unhedged/directional, exact released reservation and RECONCILED execution
    - keep kill/live byte-identical throughout; any provider, identity, write or verification failure leaves it present and the lane stopped
  proof_predicates:
    - an admission is unresolved only when its sole slot has a non-null client_order_id; require exact slot=1 and a null or positive finite claimed_utc
    - a historical violation with no lifecycle row is quiet only when every exact source is covered by a cryptographically valid RESOLVED_EXACT marker
    - an existing lifecycle row must still be terminal_proved=1 and violated=0; any current/nonterminal/violated row remains a STOP
  release:
    - the exact settlement step precedes L133's static quiet proof
    - all original L133 identity, two-guard, stream-warmup, joint-resolution, archive and rollback requirements remain unchanged

success_criteria:
  - Exact fixtures produce one COVER settlement and release only the registered execution/reservation.
  - Open provider result, wrong winner, changed identity/economics, extra held row, write failure or changed kill produces no release and no entry.
  - Empty owner/null admission passes only the canonical exact shape; any claimed client remains blocked.
  - Exact marker 215 can resolve missing historical lifecycle row 211; absent/invalid marker or any bad present lifecycle row blocks.
  - Focused tests, Bash syntax, integrated safety tests and replay parity pass before release.

