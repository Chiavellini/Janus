experiment_id: "janus-track-b-phase-b-open-collapse"
date_registered: "2026-08-17"
track: exec
program: track_b_hft
ledger_ref: "snooping_ledger.md row L11 (descriptive characterization -- costs no test look)"
status_at_registration: PENDING

# IMMUTABLE AFTER THE FIRST PHASE-B REPORT RUN.

purpose: >
  Test the strongest form of the liquidity-provision hypothesis: whether the opening spread
  collapse inherited from KXBTC15M appears on multiple non-BTC fifteen-minute series. Also produce
  a capacity census from the same observations. No modeled fill is promoted as a measurement.

why_this_is_not_a_test_look: >
  This is a pre-declared descriptive market-mechanics checkpoint. It measures spread trajectories
  and displayed depth, fits no alpha model, and selects no strategy parameters. A later MM-at-open
  PnL test is Phase C and must spend its own numbered look.

depends_on:
  phase_a_gate: "research/exec/2026-08-17_track-b-phase-a/spec.yaml checkpoint PASS"

population:
  include: "fresh Janus capture only"
  exclude_series: [KXBTC15M]
  exclude_reason: "Kilos row 20 overlaps inherited BTC episode data; BTC is prior-only"
  min_windows_per_series: 200

primary_gate:
  metric: "median spread(t=0) - median spread(t=5s), in probability points"
  threshold: 0.10
  direction: ">="
  min_non_btc_series_passing: 3
  sample_selection: >
    For each target offset use the earliest valid sample at or after the target whose late_by_s is
    within the Phase-A declared tolerance. Missing offsets remain explicit gaps and are never
    backfilled from a later target.
  on_fail: >
    STOP the flagship MM-at-open generalization. Report that its strongest form is BTC-specific
    and pivot to the separately registered flow-toxicity program; do not weaken the 10-cent bar.

descriptive_outputs:
  - "per-series window count and spread at every registered offset"
  - "depth at touch and within 1/2/5 cents"
  - "displayed-capacity cents per window and per day; explicitly not realized fills"
  - "capture completeness conditional on realized-volatility bucket"
  - "filled vs unfilled EV: OUT OF SCOPE without resting orders"

evidence_rules:
  quotes: M1
  displayed_depth: M1
  fill_rate_upper_bound: MOD
  realized_fill_rate: U
  queue_position: U
  own_impact: U

outputs:
  results: "research/exec/2026-08-17_open-collapse/results.json"
  series_csv: "research/exec/2026-08-17_open-collapse/series.csv"
  volatility_csv: "research/exec/2026-08-17_open-collapse/volatility_capture.csv"
  verdict: "research/exec/2026-08-17_open-collapse/verdict.md"

