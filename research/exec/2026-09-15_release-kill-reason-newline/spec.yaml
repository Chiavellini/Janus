    kill_reason_command_id: 469ed21b-ee56-4f71-9147-488adeb6f617
    reason_stdout: >-
      The exact expected reason followed by a newline; AWS CLI text rendering adds its own terminal
      newline, so the pipeline has an empty final line.
  defect: >-
    release.sh selects the reason with plain `tail -1`. When SSM StandardOutputContent already ends
    in a newline and the AWS CLI text formatter appends another, `tail -1` selects the empty line.
    The preceding SHA read avoids this only because grep removes blank lines.

question: >-
  Can release classification preserve the exact last non-empty SSM reason line while still failing
  closed on empty, malformed, changed, multi-line or unreviewed kill evidence?

success_criteria:
  - A real release-path harness with the expected reason plus a trailing blank line reaches the exact guard route.
  - Empty/blank-only output remains a hard failure before any provision, checkout, override, mode, helper or kill action.
  - An unreviewed non-empty reason remains rejected by the existing exact reason/digest classifier.
  - Selection changes only transport framing; it does not normalize, truncate or broaden the reason match.
  - Focused release tests and Bash syntax pass before a release retry.

authority: >-
  L134 changes no cap, hurdle, size, entry, hedge, settlement, account, kill condition or experiment
  criterion. It only permits exact pre-mutation classification evidence to survive a transport-added
  blank line. The operator explicitly authorized the agent to execute the exact release retry.
