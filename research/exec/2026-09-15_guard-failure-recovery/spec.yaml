incident:
  kill_sha256: dcc4c761ee8fb5f903475e0400b54a0ef57db8246cd7d378d4846cf181c96d83
  latched_utc: 1789484735.5242064
  reason: >-
    guard failed: RuntimeError: RuntimeError: incomplete guard snapshot:
    balance:polymarket: venue did not return a balance; fills:polymarket:
    PROJECTION_BATCH_INCOMPLETE: trade read: PolyApiExcepti
  lane_flag_id: 1169
  lane_flag: GUARD_FAILED
  known_after_latch: >-
    The lane remained active under kill/live. A read before registration found zero submitted orders
    and zero executions after the latch; later ordinary retained-kill guard passes repeatedly
