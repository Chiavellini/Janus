# IMMUTABLE AFTER THE FIRST KALSHI OR IBKR REQUEST UNDER THIS ROW.

purpose: >
  The FIRST actual test of this project's founding claim -- that newly-listed Kalshi commodity
  markets are inefficient because participants have not arrived. Three parts on the KXWTI daily
  ladder, all from a single snapshot, at zero cost: (A) is the ladder internally coherent, (B) is it
  tradeable at all, (C) does its implied mean sit at the CL futures price it settles against.

why_KXWTI_and_why_now: >
  L20 measured that KXWTI settles on EXACTLY the NYMEX CL settlement for the named contract month
  (24/24 sessions, max|diff| 4e-06, 5/5 exchange-corroborated). So the ladder's underlying IS that
  futures contract and any gap is a real mispricing rather than a reference mismatch. IBKR returns CL
  futures as `DB` -- delayed but a real book -- for free, and KXWTI is daily-settled, so no
  subscription is required to ask this question.

why_this_is_not_a_test_look: >
  Descriptive characterization of quoted prices, spreads, depth and internal coherence. No strategy
  return, no PnL, no settlement outcome, no config selected from a grid. L-row under
  snooping_ledger.md rule 5. ANY claim that a gap is HARVESTABLE requires a new NUMBERED row.

structural_facts_established_before_registering:
  ladder_is_a_survival_function: >
    Every KXWTI rung is strike_type `greater` with a floor_strike, so the quoted YES price is
    P(settle > K) directly. The ladder therefore IS a discrete survival function and needs no model
    to read as a distribution.
  fifteen_minute_series_excluded: >
    KXGOLD15M carries ONE strike per window, so there is no distribution to extract. The 15-minute
    commodity series are out of scope here for that structural reason, independent of the separate
    Pyth-oracle block.
  no_side_carries_no_information: >
    Phase 1 established no_ask == 1 - yes_bid exactly across 124,437 markets. The NO side is asserted
    as a data-quality check, never used as an independent quote.

part_A_coherence:
  monotonicity: "P(X > K) must be non-increasing in K, tested on bids, asks and mids separately"
  no_arbitrage_condition: >
    For K1 < K2, YES(K1) always pays at least as much as YES(K2), so an EXECUTABLE violation is
    yes_ask(K1) < yes_bid(K2): buy the strictly more valuable contract for less than the less
    valuable one sells for. Mid-price violations are computed and reported SEPARATELY and are NOT
    counted as violations -- trap 4, and the phase-1 error that produced a 47c fake edge.
  adjacent_and_all_pairs: "report adjacent-rung pairs and all ordered pairs separately"

part_B_capacity:
  metrics: "per rung and per event: spread, depth at touch (yes_bid_size_fp / yes_ask_size_fp), open interest, volume"
  reporting_rule: >
    Reported PER EVENT, never pooled. A pooled median across a near-dated and a far-dated ladder
    would hide the structure that matters -- the two currently differ by 5x in median spread.

part_C_implied_mean:
  estimator: >
    Trapezoidal integration of the survival function over [K_1, K_n] plus the mass below K_1:
    E_trunc = K_1 + sum_i 0.5*(P_i + P_{i+1})*(K_{i+1} - K_i).
  truncation_guard: >
    P_1 and P_n are reported alongside. If P_1 < 0.98 or P_n > 0.02 the omitted tails are material
    and the verdict is TRUNCATION_MATERIAL with NO point estimate quoted. The tails are bounded, not
    guessed, and never extrapolated with an assumed distribution.
  comparison: >
    E_trunc vs the delayed NYMEX CL futures price for the SAME contract month, parsed from
    rules_primary with L19's parser. Front-month CONTINUOUS is FORBIDDEN (L19 measured a SEP26->OCT26
    roll that fakes ~0.9 USD/Bbl of basis).
  n_is_one: >
    A single snapshot yields ONE (ladder, futures) pair per event. This is an OBSERVATION, not a
    measurement, and must be labelled so. Parts A and B are already meaningful at one snapshot
    because 95 rungs give ~93 adjacent-pair tests.

mandatory_controls:
  trap_4_three_prices: "every price reported at mid, half-spread and full-crossed; the HEADLINE is the crossed number"
  trap_3_fee_control: >
    Every price-conditioned result re-run at a flat 2c/leg. Commodity series carry fee_multiplier 1
    -- the 0.07 tier, NOT the 0.035 index tier -- so Kalshi's ceil() step is at full strength.
  trap_9_tick_band: >
    Prices are on a 1c tick, so each quote carries +/-0.5c. A gross violation smaller than 1.0c is
    inside the combined band of the two quotes and is reported as WITHIN_TICK_NOISE, not as a
    violation. Declared before the run.
  trap_12_staleness: >
    The CL quote is ~15 minutes delayed while Kalshi is live. Record both receive timestamps and the
    staleness on every row and never net them out. This is why Part C is n=1 and descriptive.
  trap_7_units: >
    Kalshi returns decimal-dollar STRINGS. Convert explicitly and assert every price is in [0, 1];
    any price outside raises rather than being clipped.

coverage_and_scope:
  series: [KXWTI]
  status: open
  events: "every open KXWTI event at snapshot time, reported separately"
  ibkr_surface: "lib/ibkr_readonly.py unchanged -- /trsrv/futures and /iserver/marketdata/snapshot only; NO new endpoint, NO subscription purchase"

verdict_rule:
  part_A: >
    COHERENT if zero executable violations survive the tick band and the flat-2c control;
    otherwise INCOHERENT with the count, the sizes, and the specific rung pairs listed.
  part_B: "descriptive; no pass/fail. Spread and depth are reported per event."
  part_C: >
    OBSERVATION only. Report the gap and its sign per event, or TRUNCATION_MATERIAL. No verdict about
    tradeability is permitted from n=1.
  immutability: "Fixed now. Not adjusted after seeing any number."

not_estimated_here:
  - whether_any_gap_is_harvestable
  - fill_probability_or_queue_position
  - option_implied_digitals
  - the_15_minute_commodity_series
  - anything_requiring_real_time_data

privacy_and_disk:
  identifiers_persisted: none
  raw_rows: "/Volumes/Kilos/janus/wti_ladder/ (never the root disk)"
  disk_floor: "abort below 2 GB free on internal /"

