  records: "box logs, executions, exact order events/fills, reservation events, settlement revisions, per-venue balances, flags, systemd and watchdog"

what_this_does_not_establish:
  - "Permission to raise a cap, exceed the protection loss allowance, enable unwind, or weaken an economic/settlement hurdle."
