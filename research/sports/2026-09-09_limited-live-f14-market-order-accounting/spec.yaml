criteria:
  - "No threshold, cap, league, settlement rule or definition moves after start."
  - "Every immediate Polymarket BUY uses MarketOrderArgsV2 with collateral floored to cents and the registered limit as its ceiling; it never increases requested spend or price."
  - "Price improvement and venue quantity precision are reconciled from authoritative fills; sub-minimum remainder is recorded as dust, not silently rounded away."
  - "A reservation grows, never shrinks, to at least authoritative buy cost plus fees while open; released zero-fills spend zero daily notional."
  - "A corrected authoritative fee revises an existing settlement row once, writes an append-only revision record, and immediately reaches the real-money loss-breaker feed."
  - "A true venue rejection, unconfirmed answer or exhausted protection window still fails closed and is never blindly retried."
  - "STOP on any venue fill not protected within 30 seconds above the registered dust, store error after submission, orphan, missing reservation, unresolved position mismatch, fee above pin, or breaker."
  - "F13's authenticated account-stream, tick-valid protection, exact-client-id, lifetime-fill, settlement and laptop-independence criteria remain in force."
  - "The first three valid F14 covers are hand-reconciled before the fourth; paper and live fill rates remain separate."

