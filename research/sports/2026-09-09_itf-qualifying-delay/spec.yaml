# IMMUTABLE FROM REGISTRATION. Some Gamma pages are already archived by L44, whose classifier
# excludes qualifying by structure without reading its terminal distribution. No qualifying
# outcome frequency or delay distribution has been inspected. This row is a separate population,
# not permission to transfer the main-draw bound to qualifying.
purpose: >
  Price the ITF qualifying settlement-delay population independently, so a reviewed rules template
  can support both main-draw and qualifying matches only through their own evidence keys.

source:
  primary: "The complete raw Gamma /events/keyset open/closed tennis archive collected by L44"
  enumeration: "Verify every archived request and response SHA-256, cursor transition, event id and terminal cursor. No additional network request is permitted by the scorer; an incomplete archive fails."
  identification: "slug starts itf-; exactly one two-outcome singles moneyline; explicit word qualifying in event title or moneyline description; doubles and non-qualifying events excluded by structure"
  scheduled_start: "explicit originally-scheduled timestamp including year in the immutable moneyline description; never the rewritten gameStartTime"
  terminal_time: "event closedTime; moneyline market closedTime only when the event field is absent; present null/empty/invalid event field is unparseable; never endDate"
  terminal_result: "winner: exactly one outcome >=0.999 and the other <=0.001; HALF: both 0.5"

window:
  snapshot_utc: "2026-09-09T07:24:03Z"
  maturity: "original scheduled start <= snapshot_utc minus 14 days"

definitions:
  denominator: >
    All mature ITF qualifying singles moneylines, open or closed. Unparseable identified qualifying
    singles count as mature adverse cases even when age is unknown. Recent parseable originals
    remain excluded. Every structural exclusion is counted separately.
  adverse: >
    A winner terminal more than fourteen days after the original start, any HALF, a mature still-open
    event, missing/invalid required fields, a winner closed before original start, or a catalog
    state mismatch/transition. Count each mature event at most once; recent structural exclusions
    remain excluded even across a catalog state transition.
  estimator: "one-sided 95% upper bound at all n: min(1,3/n) at zero adverse events, Wilson upper using z=1.6449 otherwise"
  evidence_key: "tennis.itf.qualifying.delayed_gt14d_rate"

criteria:
  - "Both archived open/closed enumerations must be complete under Gamma's documented cursor protocol. Missing pages, invalid page hashes, cursor loops, request mismatches, duplicate ids within a pass, or missing event ids fail."
  - "At least one mature candidate and at least 95% parseability among identified non-structural qualifying singles are required. Unparseable rows also enter numerator as adverse; no silent drops."
  - "The scorer must expose an authoritative close field for closed candidates; otherwise FAIL."
  - "Archive all reason-coded rows and report all structural, immature, unparseable, HALF, open, late-winner and catalog-transition cases."
  - "Only a PASS may register this key. Main-draw, ATP and WTA evidence may not satisfy the qualifying key. No point estimate is ever registered."
  - "No book, trade entry or P&L is read and no edge is claimed."

outputs:
  results: "research/sports/2026-09-09_itf-qualifying-delay/results.json"
  verdict: "research/sports/2026-09-09_itf-qualifying-delay/verdict.md"
