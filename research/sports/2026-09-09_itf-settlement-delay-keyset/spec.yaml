# IMMUTABLE FROM REGISTRATION. L42's criteria and FAIL result remain unchanged.
# Known before this row: a post-L42-registration schema probe read one current ITF winner's
# description and close timestamp. L42 enumerated 2100 older non-ITF tennis events, zero ITF.
# No historical ITF delay distribution has been inspected. The successor fixes pagination and
# strengthens the estimator against survivor bias and HALF ambiguity, before those counts exist.
purpose: >
  Measure a conservative ITF-specific reserve for a match not winner-resolved within fourteen
  days. Shared template wording does not authorize borrowing ATP/WTA's F4 population.

source:
  primary: "Polymarket Gamma /events/keyset; tennis tag; separate closed=true and closed=false enumerations"
  docs: "https://docs.polymarket.com/api-reference/events/list-events-keyset-pagination"
  pagination: "order=id ascending=true; limit=500; next_cursor passed verbatim as after_cursor until events=[] or no next_cursor; no offset"
  identification: "slug starts itf-; exactly one moneyline market with two single-player outcomes; qualifying and doubles excluded by structure"
  scheduled_start: "explicit originally-scheduled timestamp including year in market description; gameStartTime cross-check only"
  terminal_time: "event closedTime, or moneyline market closedTime only when event field is absent; never endDate"
  terminal_result: "winner: exactly one outcome >=0.999 and all others <=0.001; HALF: both outcomes 0.5"

window:
  snapshot_utc: "2026-09-09T07:24:03Z"
  maturity: "original scheduled start <= snapshot_utc minus 14 days"
  recent_events: "fully enumerated and reason-coded as immature; excluded from rate denominator"

definitions:
  denominator: >
    All identified mature ITF singles moneylines, open or closed. Unparseable identified singles
    are conservatively counted as mature adverse cases even when their true age cannot be known.
    Recent events with a parseable original start are excluded. Structural non-moneyline,
    doubles and qualifying events are counted separately.
  adverse: >
    A winner with terminal_time minus original start >14 days; any HALF (including walkovers
    where both venues may agree, conservatively); every still-open mature event; every missing
    or invalid required original/terminal/result field; and any winner closed before its
    original start (an unexplained temporal inconsistency). Count each event at most once.
  registered_value: >
    tennis.itf.delayed_gt14d_rate = one-sided 95% upper confidence bound on adverse / denominator:
    min(1, 3/n) when adverse=0; Wilson one-sided upper using z=1.6449 otherwise. Keep the upper
    bound at every n. This is deliberately no smaller than the L42 point-estimate rule.

criteria:
  - "Both closed and open enumerations must terminate according to Gamma's documented cursor protocol. A cursor loop, duplicate id within an enumeration, missing id, or request failure fails the run."
  - "An event seen closed and open across the two passes is counted once as adverse (state changed during enumeration), reported separately."
  - "At least one mature candidate is required; point estimates are never registered. n and the bound must be reported so a small sample prices itself conservatively."
  - "At least 95% of identified non-structural singles must have parseable required fields for their state. Every unparseable row also contributes an adverse case; no silent drop."
  - "If Gamma does not expose an authoritative close timestamp for closed candidates, FAIL. An invalid present event timestamp is not replaced by a market timestamp."
  - "All exclusions and adverse cases are reason-coded in the archived event rows. Raw pages, request parameters, page hashes, and cursor transitions are retained on the Janus data volume."
  - "The script reads no order book, entry, or P&L and claims no edge or realized profit."

outputs:
  results: "research/sports/2026-09-09_itf-settlement-delay-keyset/results.json"
  verdict: "research/sports/2026-09-09_itf-settlement-delay-keyset/verdict.md"
  evidence: "nodes/settle_wedge/evidence.py: tennis.itf.delayed_gt14d_rate only after PASS"

what_this_does_not_establish:
  - "That Kalshi's unspecified post-fourteen-day payout equals Polymarket's 50-50."
  - "That a historical upper confidence bound guarantees future frequency or profit."
  - "Any ATP/WTA, qualifying, doubles, or other non-ITF population."
