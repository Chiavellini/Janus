    kalshi_retention_floor_m1:
      finding: >
        Kalshi's settled-market enumeration reaches back only ~68 days. Confirmed on THREE
        independent series families with three different query shapes: L15 index (KXINX/KXINXU,
        earliest 2026-06-12), L17 BTC (KXBTC/KXBTCD, earliest 2026-06-12T00:00Z), L18 FOMC
