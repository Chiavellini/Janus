  deliberately_out_of_scope:
    r3_fast_lane: >
      The ~5 s at-open window (KXBTC15M: spread 24c -> 2c by +5 s, +4.10c/fill, n=3,196) is R3's
      mechanism, and JANUS_CHECKLIST.md:98 requires Kilos coordination that is UNSETTLED. L24 targets
      the hours-wide window in illiquid non-sports markets instead, which nothing has examined.
    mentions: >
      Excluded by the state.yaml CFTC gate (280 Kalshi + 197 PM held back). catalog/prefilter.py
      enforces this in code rather than by convention; --include-mentions lifts it explicitly.
    the_analysis: >
      "Does an executable, fee-surviving gap appear at birth, and how often" costs the project's
      first numbered test look. NOT registered here; the operator chooses L-row vs numbered.

  capacity_characterization_2026_08_20:
    status: "characterization only -- no outcome read, no edge measured, NO test look spent"
    method: >
      Depth at touch and the full visible ask ladder, pulled live from Kalshi and the Polymarket CLOB
      for markets drawn from L24's 1,834 verified pairs. The INHERITED edge numbers in AGENTS.md are
      used only as a YARDSTICK against the slippage curve; nothing new about edge is claimed here.

    correction_to_first_pass: >
      A first pass summed touch-dollars PER PAIR and reported $131,099. That triple-counts: one
      Kalshi market can appear in many pairs (the Fed "Hike rates by 0bps" market appeared 8 times at
      $4,707 each). Deduplicated to unique markets the figure is $38,918 across 509 unique Kalshi
      markets. Any capacity statistic must be computed per MARKET, never per pair.

    kalshi_touch_dollars_unique_markets:
      total: 38918
      p50: 9.31
      p90: 155.68
      p99: 1231.48
      max: 4706.96

    concentration: >
      Top 1 market = 12.1% of all capacity, top 10 = 46.4%, top 50 = 76.2%, top 100 = 88.1% of 509.
      OPERATIONAL CONSEQUENCE: a scanner over 95,852 markets is the wrong shape. Roughly 50 markets
      hold three quarters of the money that can actually be transacted.

    pm_is_NOT_deeper_at_the_touch:
      finding: >
        Measured on the same 40 markets: Kalshi p50 $4.00 at touch, Polymarket p50 $3.12 -- a ratio
        of 0.8x. Polymarket is marginally THINNER at the touch, not deeper.
      retraction: >
        An earlier claim that PM carried ~200x Kalshi's capacity was WRONG. It rested on gamma's
        `liquidityNum` (p50 $1,603), which is a derived aggregate and NOT executable size at the
        touch. Never use liquidityNum as capacity.

    the_capacity_edge_tradeoff:      # the finding that actually answers "can we make money"
      pm_ask_side_by_slippage_cap: >
        dollars deployable before AVERAGE slippage exceeds the cap, n=50 markets:
          <=1.00c  p25 $19  p50 $50   p75 $198  p90 $887
          <=2.00c  p25 $37  p50 $88   p75 $443  p90 $2,236
          <=3.00c  p25 $53  p50 $111  p75 $717  p90 $4,635
          <=4.45c  p25 $61  p50 $158  p75 $717  p90 $4,805
      reading: >
        The book is DEEP BUT NOT AT THE TOUCH -- p50 $6.96 at touch, $79.81 within +5c, $12,050 across
        the full visible ladder. So size is purchasable and its price is slippage, which comes
        straight off the edge. On the MEDIAN market a 2c slippage cap absorbs $88; against the live
        tracked +3.05c that nets ~1.05c, i.e. under a dollar per trade. The p90 market absorbs $2,236
        on the same cap, i.e. roughly $23.
      consequence: >
        Edge and size are inversely related here, which is the signature of a real but
        capacity-constrained inefficiency rather than a free lunch. It also explains why the program
        measured healthy EV-per-trade for a year and never produced a dollars-per-day figure: the
        objective in AGENTS.md is EV-cents per trade, and cents per trade times unmeasured size is
        unmeasured money.
      open_hazard_NOT_yet_tested: >
        Capacity may be inversely correlated with EDGE -- the deep markets could be deep precisely
        because they are well arbitraged, in which case the top decile that holds the money is the
        decile with no edge in it. That is a real possibility, it is testable, and testing it is the
        registered analysis that costs the first numbered test look. It is NOT tested here.

    why_at_open_matters_more_after_this: >
      Slippage is subtracted from whatever the edge is, so the edge's SIZE decides how much size is
      affordable. AGENTS.md's at-open read (+8.71c, n=180) survives a 2c slippage cap with 6.7c
      intact; the mid-window rule (+4.447c, n=952; live +3.05c) has about 1c left. That is an
      independent argument for the newborn window L24 captures, arrived at from microstructure rather
      than from the tape result.

capacity_edge_correlation_L25:
  ledger_row: L25
  spec: research/exec/2026-08-20_capacity-edge-correlation/spec.yaml
  executed_utc: "2026-08-20"
  test_looks_spent: 1        # THE PROJECT'S FIRST. Janus is no longer at zero.
  verdict: "NOT_SIGNIFICANT -- no evidence edge is anti-correlated with capacity; NOT proof of absence"
  primary: "median edge top decile 43.758c vs rest 24.471c, diff +19.287c, p=0.128 (bar 0.0040)"
  secondary: "Spearman rho=-0.0646, p=0.154"
  robustness_precommitted: "|edge|<=20c: n=193, diff +2.059c p=0.365; rho=-0.1128 p=0.120"
  the_result_is_really_a_contamination_measurement: >
    A median apparent edge of 24.5c across all markets is not a plausible cross-venue number -- it
    implies two legs costing 75.5c for a $1 payoff. The pre-committed trim drops 494 -> 193 markets,
    so 61% carry |edge| > 20c, which screen.py:26 already names as the signature of pairs that are
    NOT the same question. The row is therefore largely uninformative about its own hypothesis.
  sign_disagreement: >
    The decile difference is POSITIVE and Spearman rho is NEGATIVE. No monotone relationship produces
    that, so the decile split is not a clean size effect and neither number should be quoted alone.
  consequence: >
    match/gold/nonsports.csv is now the BINDING CONSTRAINT on every cross-venue statistic in the
    program. It was pre-registered as the largest threat before the run; the result promoted it from
