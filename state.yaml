schema_version: 1
last_updated: "2026-07-24"
track: janus
description: >
  Cross-venue Kalshi <-> Polymarket engine over the shared market corpus. Phase-1 scope is the
  exact-match intersection: 7 assets x 15-minute up/down (BTC, ETH, SOL, XRP, DOGE, BNB, HYPE).
  Two strategy families under test: convergence (directional, on the lagging venue) and the
  hedged two-leg (both venues, held to resolution). Read-only consumer of ~/Code/Kilos.

phase: 0
phase_name: scaffold
authorization:
  capital: none
  live_trading: false
  arming_allowed: false
  note: >
    Own capital only (operator decision 2026-07-24). No outside capital in scope; no pooled
    vehicle, no entity work. Arming requires a registered PASS plus an explicit signed override,
    per GATE_TO_LIVE.md.

lead:
  primary: R1_convergence_generalized
  description: >
    Port Kilos' registered mid-window convergence rule (offsets {0,120,300,480,660}s, first
    |divergence| >= 5pp, buy the PM side Kalshi favors, hold to settlement) from BTC-only to all
    7 paired assets. BTC is the reproduction anchor, not evidence.
  status: NOT_STARTED
  blocked_on: Phase 1 (pair map) and Phase 2 (collector)
  prior: >
    Encouraging but not established for the alts. Kilos' C6 Kalshi-agree cell was positive on
    6 of 6 series, and its pooled 4-alt same-event 15m read was +11.91c [+2.77, +20.56] excl-0,
    n=114. That is spent Kilos evidence used as a PRIOR here, never as a Janus result.
  secondary:
    - R2_hedged_two_leg
    - R3_kalshi_mm_at_open

gates:
  g1_no_leak:      {status: NOT_STARTED, note: "no features built yet"}
  g2_ic_screen:    {status: NOT_STARTED}
  g3_permutation:  {status: NOT_STARTED}
  g4_robustness:   {status: NOT_STARTED, note: "2x fee stress axis defined in lib/venue_costs.py:STRESS_PAIRS"}
  g5_holdout:      {status: NOT_STARTED, note: "no holdout era declared yet; see holdouts below"}

snooping:
  ledger: snooping_ledger.md
  test_looks_spent: 0
  rows_total: 0
  bh_fdr_q: 0.10
  next_row: 1
  inherits_from_kilos: false
  note: >
    Fresh budget. Janus does NOT inherit Kilos' row counts. Reusing spent Kilos evidence as a
    Janus characterization or prior is free; using it as a Janus test look is not.

holdouts:
  declared: false
  note: >
    No Janus holdout exists yet -- no Janus data has been collected. The forward era will be
    declared and sealed when the Phase-2 collector passes its 72h soak gate. Kilos' sealed eras
    are NOT Janus holdouts and must not be read to answer a Janus question.

corpus:
  phase1_assets: [btc, eth, sol, xrp, doge, bnb, hype]
  phase1_timeframe: 15m
  paired_windows_per_day: 672
  kalshi_series_pattern: "KX{ASSET}15M"
  pm_slug_pattern: "{asset}-updown-15m-{window_start_unix}"
  alignment: "UTC 15-minute grid (:00/:15/:30/:45); match on implied close time"
  not_paired:
    - "PM 5m markets -- Kalshi has no 5-minute series (shortest cadence is fifteen_min)"
  settlement_mismatch:
    kalshi: "BRTI (CF Benchmarks), vs floor_strike set from the prior window's close"
    polymarket: "Chainlink data stream, vs the window open"
    measured_offset_bps: 10        # BTC only, measured in Kilos
    opposite_settle_rate: UNMEASURED
    note: >
      This is why the two-leg position is not flat. Measuring the per-asset opposite-settle rate
      is the FIRST deliverable of R2, before any two-leg sizing.

cost_pins:
  source_of_truth: lib/venue_costs.py
  verified_utc: "2026-07-24"
  kalshi:   {taker_coeff: 0.07, maker_coeff: 0.0175, rounding: "ceil, per order", settlement_fee: 0}
  polymarket: {taker_rate: 0.07, exponent: 1, taker_only: true, maker_rate: 0.0,
               rebate_rate: 0.2, rebate_credited: false, rebate_status: UNVERIFIED}
  limits: {pm_min_order_shares: 5, pm_tick: 0.01, kalshi_tick: 0.01}

path_to_live:
  gate_edge: NOT_STARTED
  gate_tradability: OPEN
  tradability_note: >
    Operator declared non-US 2026-07-15, so Polymarket's geo-block does not bind and Kalshi is a
    CFTC-regulated venue the operator can use. Both venues are legally reachable; EDGE is the
    only gate. Kalshi ORDER PLACEMENT does not exist yet in either project and is new build.
  blocked_on: "Phase 1 -> Phase 2 -> R1"

forward_infra:
  collector: NOT_BUILT
  launchd_namespace: "com.janus.*"
  jobs_installed: []
  data_root: "/Volumes/Kilos/janus"
  disk_free_gb_at_phase0: 863
  measured_burn_rate: "~4.8 GB/day/series (Kalshi per-delta L1, measured on Kilos kalshi_ob_data.db)"
  retention_plan: "hot tier 3-5 days in SQLite; nightly parquet cold tier; fail-closed disk floor"

shared_services:
  contract: SHARED_SERVICES.md
  reads:
    - "Kilos DaC/data/pm_data.db (mode=ro)"
    - "Kilos DaC/data/pm_xa_data.db (mode=ro)"
    - "Kilos DaC/data/market_data.db (mode=ro, POST-2026-07-17 rotation only)"
    - "/Volumes/Kilos/shards/market_data_20260717T043030Z.db (mode=ro, pre-rotation history)"
    - "Kilos DaC/data/pm_exec/basis_divergence_ab.csv"
  writes: ["/Volumes/Kilos/janus (own data only)"]
  imports_kilos_python: false

coordination:
  - item: "Kalshi MM-at-open evidence"
    detail: >
      Registered in Kilos as its snooping row 20, forward clock started 2026-07-21. Janus R3
      covers the same mechanism across 7 series. Settle who spends the evidence before either
      project reads it.
  - item: "Kilos config is stale vs the live venue"
    detail: >
      Kilos KALSHI_15M_SERIES lists 5 series and no XRP/HYPE; 15 fifteen_min series exist as of
      2026-07-24. Report upstream; do not edit Kilos.

open_items:
  - "Project name -- Janus is a working name."
  - "PM rebateRate 0.2 appears in the live fee schedule and is modelled nowhere. Pin it against a real maker fill before crediting it."
  - "Kalshi maker fee tier -- re-verify 0.0175 against a real fill before sizing any maker strategy."
  - "No measured Kalshi<->PM clock offset exists. Fine for 15m windows (matching is on implied close time); will not survive sub-second work."
  - "Whether to widen past the 7-asset intersection later (sports pairs; Kalshi hourly strike ladders and their intra-venue no-arb checks)."

next_action: >
  Phase 1 -- build catalog/enumerate_kalshi.py, catalog/enumerate_pm.py, catalog/build_pair_map.py.
  Gate: 7 assets x 15m mapped, >=95% of windows matched, zero silent drops, byte-identical on
  re-run.

# =====================================================================================
# APPENDED 2026-08-14 -- PHASE 2. Everything above this line is the phase-1 declaration
# and is NOT rewritten. Phase 2 adds tracks; it does not restate or amend phase-1 scope.
# =====================================================================================

tracks:
  sports:
    added: "2026-08-14"
    owner: track_a
    status: STAGE_2_COMPLETE
    thesis: >
      Phase 1's central negative rested on n=35 title-matched pairs out of ~100k markets -- a
      matcher limit, not a venue fact. Sports is where the matcher problem is solvable: one game
      is co-listed by Kalshi, Polymarket, every betting exchange and every sportsbook; settlement
      is unambiguous, so phase 1's semantic-non-fungibility killer does not apply; and both venues
      already encode a parseable structured key, which is exactly what title-Jaccard threw away.
    scope:
      strategy: pure cross-venue arbitrage (cover every outcome, hold to settlement)
      leagues_v1: [mlb]             # CORRECTED 2026-08-17 (L8): the plan said [nfl, nba], but
                                    # NBA and NHL have ZERO games in an 8-day window from 08-17
                                    # and NFL is preseason only. Measured: MLB 99, WNBA 20,
                                    # NFL 16 (preseason), EPL 10, NBA 0, NHL 0. Add NFL at the
                                    # regular-season open (~2026-09-10), NBA/NHL in October.
                                    # The spine is league-agnostic, so this costs nothing.
      market_types_v1: [moneyline]  # spreads/totals deferred until moneyline matching passes
      venues_v1:
        free_read: [kalshi, polymarket, smarkets, sxbet]
        deferred: [betfair, matchbook, sporttrade, pinnacle, circa, forecastex]
      betfair_note: >
        Deferred by operator decision 2026-08-14. Live App Key costs GBP 499 one-off, read-only
        use is not permitted under its terms, and the Premium Charge (up to 60% weekly above
        GBP 250k cumulative profit when commission is under 20% of gross) targets precisely the
        arbitrageur profile. It is a capacity constraint, not a per-trade fee.
      mentions_note: >
        Mention markets parked pending a read of the CFTC probe regulatory record (NPR
        2026-08-13), by operator decision 2026-08-14. Do not commit build effort before that read.
    matching:
      method: canonical_key_via_external_schedule
      key: "league + {sorted participants} + start_utc(+/-window) + market_type + period + line + side"
      anchor: ESPN public schedule API (both venues join to it; never to each other)
      embeddings: NOT_USED_IN_V1
      embeddings_rationale: >
        Once canonical keys exist, embedding similarity adds noise and no recall. A missing pair
        means an alias-table hole -- fix it deterministically and auditably. One bad alias
        manufactures a false pair that looks enormous; that is the phase-1 "+97.94c golfer vs
        cyclist" failure mode.
    stages:
      stage_0_schema_and_fees:
        status: COMPLETE
        completed: "2026-08-14"
        ledger_row: L7
        network_calls: 0
        artifact: research/sports/2026-08-14_cost-model-rebuild/
        built: [lib/schema.py, lib/fees/, lib/venues/, tests/test_schema_fees.py]
        regression_contract: >
          Every anchor in lib/venue_costs.py reproduces digit-for-digit through the new fee API
          (7 prices x 5 order sizes, maker tier, per-series multiplier, PM continuous curve, and
          the on-chain-verified pm_fee_usd(13.51, 0.37) = 0.2205). tests/test_lib.py 13/13
          untouched. tests/test_schema_fees.py 18/18.
      stage_1_entity_schedule_spine:
        status: COMPLETE
        completed: "2026-08-17"
        ledger_row: L8
        artifact: research/sports/2026-08-17_entity-schedule-spine/
        deliverables: [lib/entities/, lib/schedule/espn.py, catalog/stage1_checkpoint.py,
                       tests/test_spine.py]
        checkpoint: ">=99% of one league's games for one week resolve to a game_id"
        result: "PASS at 100.0% - 280/280 venue events across 4 leagues, 0 failures"
        tables: {teams: 159, xrefs: 191, aliases_generated: 644, aliases_manual: 70,
                 xref_conflicts: 0, ambiguous_alias_keys: 6}
        key_facts:
          kalshi_close_time: >
            close_time/expiration_time = scheduled start + EXACTLY 3 days (postponement buffer).
            expected_expiration_time/occurrence_datetime = expected END. The START is only in the
            event ticker and in rules_primary. A join keyed on close_time is 3 days late.
          pm_slug_date: >
            THE SLUG DATE IS NOT THE GAME DATE. mlb-stl-cin-2026-05-24 was PLAYED 2026-08-17. PM
            keeps the original slug on a postponed game; Kalshi re-mints on the new date. A
            slug/ticker-date join drops precisely the POSTPONED games - the highest-wedge subset.
            Use markets[].gameStartTime (PM) and rules_primary (Kalshi); they agree exactly.
          venue_team_ids: >
            Kalshi custom_strike.{sport}_team is a stable UUID (30 distinct for 30 MLB teams, zero
            collisions); PM exposes teams[].id. Where an xref exists there is NO string matching.
          kalshi_no_sub_title: "equals yes_sub_title on 82/82 MLB markets - NOT the opposing team"
          espn_host: "site.api.espn.com is 403; use site.web.api.espn.com"
          espn_is_kalshi_settlement_source: >
            KXMLBGAME settlement_sources = [ESPN, Fox Sports, mlb.com]. The schedule anchor is the
            venue's OWN primary reference, not a neutral third party we chose.
          epl_soccer_wedge: >
            KXEPLGAME rules_primary states 'after 90 minutes plus stoppage time (does not include
            extra time or penalties)'. Stage-4 input, sourced from the venue.
          kalshi_sports_surface: "3,414 sports series; game-level *GAME series for ~250 leagues"
      stage_2_matching_no_prices:
        status: COMPLETE
        completed: "2026-08-17"
        ledger_row: L9
        artifact: research/sports/2026-08-17_stage2-matching/
        result: >
          GATE PASS. Coverage 1.00 (41/41 eligible games, threshold 0.80). Precision 1.00 (36/36,
          threshold 0.98) -- but 0.9722 AS RUN, which FAILED; the single failing pair was a GOLD
          LABEL error, not a matcher error, corrected by an appended row after a uniform re-audit
          of all 128 rows that produced exactly one change and none in the favourable-only
          direction. Both figures reported. 41 paired games / 82 outcome pairs / 0 false positives.
        headline: >
          Phase 1's n=35 was a TOOLING ARTIFACT. It found 35 pairs across the entire ~100k-market
          corpus across all categories; Stage 2 finds 41 paired games in ONE league in ONE 8-day
          window with no similarity score, no threshold and no recall cap. This says NOTHING about
          edge -- listing is filter one of four.
        kalshi_listing_horizon:
          finding: "72 HOURS, a clean step function - NOT a coverage limit"
          measured: {"<24h": "11/11", "24-48h": "15/15", "48-72h": "15/15",
                     "72-96h": "0/9", ">96h": "0/49"}
          consequence: >
            The addressable set is time-shifted, not halved. A forward collector must POLL
            CONTINUOUSLY rather than snapshot, and Stage 3 sampling must begin inside 72h of first
            pitch or it observes nothing on the Kalshi side.
        note: "FIRST FALSIFIABLE RESULT. This is where n=35 dies or survives."
        pre_registered_gate:
          coverage: ">=0.80 of games where BOTH venues list a moneyline (denominator from the
                     schedule, independent of the matcher)"
          precision: ">=0.98 against ~150 hand-labelled pairs in match/gold/, labelled BEFORE
                      any tuning"
        kill_meaning: >
          If pairs are still tiny after canonical-key matching, the venues genuinely do not
          co-list. That is a venue fact and the thesis dies honestly, for the right reason.
      stage_3_fee_net_divergence:
        status: IN_PROGRESS
        started: "2026-08-17"
        ledger_row: L12
        spec: research/sports/2026-08-17_stage3-divergence/spec.yaml
        artifact: research/sports/2026-08-17_stage3-divergence/
        built: [screen/cover.py, screen/analyze_stage3.py, collectors/sports_books.py,
                tests/test_cover.py]
        collection_status: >
          RUNNING. The registered design is 5-minutely for 7 days; the verdict is held at
          PRELIMINARY by a data-sufficiency guard in analyze_stage3.py until >=168 polls and
          >=5,000 observations at depth. Declaring the registered conclusion on a 20-minute
          sample is precisely what the pre-registration exists to prevent.
        preliminary_finding: >
          PRICES DIVERGE; THE FEE FLOOR EATS IT. Gross cover (book prices alone) falls below 1.00
          in ~3.1% of observations, best seen 0.98 -- a real 2c divergence that holds to 500
          contracts. But the median fee on the reachable venue pair is ~2.8c, so the cheapest
          cover observed is 1.0099. Zero observations below the 0.995 arb threshold at any size.
          This is a SHARPER statement than phase 1's: not 'the venues agree' but 'the venues
          disagree by less than it costs to trade the disagreement, on the only pair we can reach'.
        venue_availability_correction: >
          MATERIAL. All three cheap legs behind L7's 7.5x fee-floor headline are UNREACHABLE:
          Smarkets returns HTTP 403 across three header variants, Sporttrade has no public API,
          Pinnacle's closed Jul 2025, Betfair is deferred by operator decision. L7's arithmetic
          stands; its practical reach does not. The cheapest READABLE pair is PM+SXBet at 1.25c.
          The measured 2c gross divergence WOULD clear a 1.0c floor -- so venue access, not
          market efficiency, is now the binding constraint.
        controls_passing:
          intra_venue: >
            0 of 204 single-venue covers price below 1.00, as L1 predicted from the complement
            identity (0 violations in 124,437 markets). A single-venue cover printing an edge
            would be a bug signal, not a discovery. The pipeline is validated against it.
        collector_bugs_found_and_fixed:
          misapplied_liquidity_guard: >
            Same-venue covers were rejected as shared_liquidity_source. They are legitimate, and
            per L7 the CHEAP structure. The guard now checks what it was meant to: two renderings
            of the SAME OUTCOME (Kalshi vs Robinhood) treated as independent books.
          fetch_all_then_price: >
            All books were fetched before one clock reading was taken, so early games were minutes
            stale -- 93 of 192 observations in the first run. The freshness check CAUGHT it, which
            is the system working. Books are now fetched and priced PER GAME. Both pre-fix runs are
            in data/sports/stage3/quarantine/ with a README, not deleted.
        note: "THE CORE RESULT. Poll 5-minutely for 7 days. Log settlements from day one."
        pre_registered_kill: >
          If fewer than 0.5% of observations show net cover cost < 0.995 at >=$200 depth AND none
          persists a 60s re-fetch, the thesis is dead.
      stage_4_settlement_wedge:
        status: NOT_STARTED
        note: "Free -- runs on Stage 3's data, PROVIDED Stage 3 logs settlements from day one."
        gate_rule: "An unknown ruleset is a BLOCK, not zero risk."
      stage_5_verify_and_first_look:
        status: NOT_STARTED
        note: "Only if 2-4 survive. First NUMBERED test look happens here and nowhere earlier."
    governance:
      stages_1_to_4: "L# descriptive rows -- free, no test look"
      stage_5: "one numbered row at BH threshold 0.1/m"
      arming_allowed: false

  track_b_hft:
    added: "2026-08-14"
    owner: separate_agent_parallel
    status: PHASE_A_72H_COLLECTION_RUNNING
    mandate: research_and_backtest_only
    handoff: [handoffs/TRACK_B_BRIEF.md, handoffs/TRACK_B_LAUNCH_PROMPT.md]
    scoping_law: >
      These venues are inefficient in LIQUIDITY PROVISION, not in PRICE. The price is anchored by
      an underlying anyone can observe for free; what is missing is anyone willing to quote in the
      first five seconds. This cut disposes of roughly two-thirds of the strategy taxonomy.
    ml_kill: >
      RenTech stacks thousands of weak signals because their marginal cost is <1bp. Here
      ceil(0.07*C*P*(1-P)) is >=1c against a 1c tick, so the minimum viable signal is 200-400bps.
      The entire weak-signal regime sits below the cost floor. Correct model complexity is 1-3
      parameters; reject anything larger on sight.
    coordination_resolved:
      kilos_row_20: >
        RESOLVED FOR FREE. Only BTC Kalshi data exists on disk (KXBTC15M, 2026-07-17 -> 08-03).
        Declare the BTC episode set unreadable and collect fresh on the six untested series, where
        Kilos has no claim. No negotiation with Kilos needed.
    infra_corrections:
      burn_rate: >
        The 4.8 GB/day/series figure in forward_infra is CONTINUOUS PER-DELTA L1 and is the wrong
        budget for episode capture. The first ~60s of each window -- all MM-at-open needs -- is
        ~1 MB/day/series; all 19 series is ~20 MB/day. Different projects.
    websocket: >
        All 15-minute series open on the same :00/:15/:30/:45 instant. 19 series x 1Hz is ~190
        tokens/s against a 200/s ceiling. The authenticated WebSocket is a PRECONDITION, not an
        optimization.
    phase_a_implementation:
      registered_rows: [L10, L11]
      artifacts:
        - collectors/track_b_core.py
        - collectors/collect_track_b.py
        - collectors/report_track_b.py
        - collectors/TRACK_B.md
        - tests/test_track_b.py
        - research/exec/HYPOTHESIS_REGISTRY.md
      tests: "9/9 hermetic Track B tests passing; three inherited baseline suites also green"
      public_probe:
        evidence_tier: M1
        measured: "2026-08-17"
        kalshi_fifteen_min_series: 19
        kalshi_open_at_probe: 12
        polymarket_current_15m_found: 7
        retries: 0
        http_429s: 0
        artifact: research/exec/2026-08-17_track-b-phase-a/public_probe.md
      authenticated_smoke:
        evidence_tier: M1
        measured: "2026-08-17"
        result: PASS
        kalshi_ws: "authenticated; live orderbook/trade subscription observed"
        polymarket_ws: "live books/trades observed"
        chainlink_rtds: [btc/usd, eth/usd, sol/usd, xrp/usd]
        credential_storage: "/Volumes/Kilos/janus/credentials (owner-only mode; no repository secret)"
      collection:
        label: com.janus.track-b-collector
        started_local: "2026-08-17 10:02 CST"
        first_fresh_boundary_local: "2026-08-17 10:15 CST"
        data_db: "/Volumes/Kilos/janus/track_b/episodes.sqlite"
        process_policy: "launchd KeepAlive; nice=19; research-only collector"
        diagnostic_artifacts:
          - "/Volumes/Kilos/janus/track_b/smoke/episodes_2026-08-17_auth-rtds-smoke.sqlite"
          - "/Volumes/Kilos/janus/track_b/smoke/episodes_2026-08-17_first-boundary-late.sqlite"
        first_boundary_correction: >
          The first attempted window exposed event-loop stalls from one SQLite commit per tape,
          reference, and episode row. The failed window was preserved, never counted toward the
          soak, and the writer changed to buffered transactions with commits suppressed from
          t=-0.5 through t=+62s. The registered >=98% criterion was not changed.
      known_reference_gap: >
        Polymarket RTDS emitted no XAUUSD/XAGUSD/WTI Pyth frames in authenticated smoke tests.
        Each feed has an isolated liveness channel; missing values remain UNKNOWN and are never
        substituted. This does not stop quote capture, but volatility-conditional completeness
        for those series is blocked unless the feed begins publishing or separate Pyth access is
