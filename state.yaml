    reading: "the binding two-leg capacity is ~7x deeper in sports, and PM is the THIN leg here --
              the reverse of non-sports, where the two venues were comparable at the touch"

  THE_NEWBORN_CONFIGURATION_EXISTS_AND_IS_SCHEDULED:
    finding: >
      Polymarket lists an MLB game ~82 HOURS BEFORE Kalshi opens its market for the same game.
      Measured on 7 paired games: +81.9h, +83.4h, +83.4h, +82.4h, +81.9h, +82.4h, +82.4h. PM's
      createdAt is a scheduled batch at 13:00 UTC; Kalshi's open_time lands ~3.4 days later.
    why_this_is_the_strategy: >
      This is exactly the operator's thesis in its cleanest form. By the time Kalshi OPENS, PM has
      been trading the same game for three and a half days and carries an ESTABLISHED price; Kalshi's
      opening price is the one that has not been properly calculated yet. Reference leg = PM,
      newborn leg = Kalshi.
    why_it_is_tractable: >
      Kalshi publishes open_time IN ADVANCE, so the newborn moment is SCHEDULED, not merely
      discoverable after the fact -- the collector can be polling at t=0. And it repeats: ~15 MLB
      games a day, every day, with deterministic pairing.
    direction_is_an_OPEN_question: >
      AGENTS.md's inherited "truth sits at Kalshi" was measured on crypto 15m where Kalshi LEADS.
