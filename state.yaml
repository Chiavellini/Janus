cross_venue_newborn:
  ledger_row: L24
  spec: research/exec/2026-08-20_newborn-capture/spec.yaml
  status: REGISTERED_PENDING     # capture characterization; costs NO test look
  test_looks_spent: 0

  why_the_prior_nulls_do_not_bind:
    matcher_pipeline_had_a_MISSING_STAGE:
      finding: >
        match/block.py:7 and match/screen.py:10 both document the pipeline as
        "block -> ECONOMIC SCREEN -> LLM equivalence verify -> trade", and match/verify.py DID NOT
        EXIST. Blocking is deliberately recall-optimised ("expected, even, to emit garbage") and had
        no adjudicator, so candidates could never be promoted to pairs. This is the mechanism behind
        phase 1's n=35, which AGENTS.md already concedes is "a matcher limit, not a venue fact".
      evidence_tier: M1
    every_screen_sampled_MATURE_markets:
      finding: >
        On the 12,684-market research/mentions/kalshi_tape.jsonl -- whose features are taken at fixed
        offsets from market OPEN by construction -- the median Kalshi market goes 2.0 h from open to
        first trade (p25 0.6 h, p75 7.2 h, p90 16.3 h). Share with no traded price yet: 94.8% at
        t+5min, 86.4% t+15min, 76.9% t+30min, 63.6% t+1h, 49.7% t+2h, 28.1% t+6h.
      consequence: >
        A snapshot screen cannot see a dislocation that lives in a market's first hours. This is a
        cleaner explanation of phase 1's negative than venue efficiency.
      caveat_that_must_not_be_dropped: >
        The tape records TRADES, not QUOTES. Absence of a print is NOT absence of an executable
        quote -- a maker may be quoting into silence. L24 therefore captures the ORDER BOOK. First
        live probe of three newly-created PM markets returned EMPTY books (0 bid / 0 ask levels),
        which is the observation the capture exists to characterise properly.
      evidence_tier: M1

  live_universe_2026_08_20:
    kalshi: "95,852 tradeable markets (parlays excluded); 25,095 short-dated AND two-sided"
    polymarket: "179,863 markets; 91,464 short-dated tradeable"
    note: "phase 1's n=35 sampled roughly one pair per 3,000 markets"
    artifacts: "data/catalog_2026-08-20/ -- the July snapshot at data/catalog/ was NOT overwritten"

  verify_stage_now_exists:
    file: match/verify.py
    gold: match/gold/nonsports.csv          # 144 pairs, 8 strata, verdicts withheld to a .key.json
    precision_gate: 0.98
    precision_NOT_YET_SCORED: >
      The deterministic layer was developed by INSPECTING the 2026-08-20 corpus, so its author
      cannot grade it on that corpus. The sheet is BLIND and must be labelled by the operator before
      any precision number is quoted. Same discipline as match/gold/mlb_moneyline.csv and
      research/mentions/HOLDOUT.md.
    non_sports_yield: >
      4,605 Kalshi x 5,739 PM in scope -> 51,306 blocked candidates -> 1,834 surviving pairs across
      509 distinct Kalshi and 593 distinct PM markets (176 clean 1:1). Byte-identical on re-run.
    rejection_reasons: >
      STRIKE_MISMATCH 19,642 · RESOLUTION_DATE 15,962 · ARCHETYPE 12,352 · SUBJECT_MISMATCH 1,170 ·
      SUPERLATIVE_VS_THRESHOLD 228 · QUALIFIER 97 · STRIKE_DIRECTION 21
    traps_it_catches_that_titles_cannot:
      threshold_ladder: >
        Kalshi lists a full ladder on one event. ISM PMI "At least 52".."At least 59" are eight
        markets and blocking matched every rung to the single PM market at 59; seven are false. The
        structured floor_strike/cap_strike (present on 4,144 of 4,605 rows) kills them rung-by-rung.
      subject: >
        Kalshi "Insidious: Out of the Further" was matched to PM '"Mutiny"' and '"Spa Weekend"' at
        the SAME score threshold -- the number agrees and the film does not. Golfer-vs-cyclist again.
      trigger_set_asymmetry: >
        On the 2026-07-25 mentions corpus, Kalshi's dominant AI term is "AI / Artificial
        Intelligence" (EITHER triggers, 275 markets) and PM's is "AI" alone (83). Kalshi's condition
        is a strict SUPERSET, so it trades structurally higher forever with NO arbitrage in it.
        A subset/superset relation is a HARD REJECT, never a scored penalty.
    bugs_found_and_fixed_during_development:
      - "trigger extractor ran on every market and invented disjoint sets -- 1,350 false rejects
         (an ISM pair 'differed' on the trigger 'the manufacturing pmi registered 527 percent').
         Now gated to utterance markets only."
      - "archetype 'other' is block.py's NO-MATCH SENTINEL and was being read as evidence of
         difference, rejecting e.g. SpaceX launches (threshold_price vs other) which ARE the same
         contract. Now fires only when BOTH sides are positively classified."
      - "the subject check hijacked utterance markets, where the PM quoted string is the TRIGGER and
         not a subject. Caught by tests/test_verify.py."

  screen_fee_bug_fixed:
    file: match/screen.py
    was: "pm_fee_c() applied the constant vc.PM_TAKER_RATE (0.07) to every market"
    now: "per-market feeSchedule via the catalog row; rate and its source recorded on every scored pair"
    measured_in_scope: "rate 0.07 -> 2,426 markets · 0.04 -> 1,577 · 0.05 -> 1,481 · absent -> 255"
    why_it_mattered: >
      3,058 of the 5,484 markets carrying a schedule (56%) were being overcharged, up to 0.75c/leg at
      the money against a two-leg floor of ~3.75c. The bias was toward "NO EDGE", which is the more
      dangerous direction: a missed edge is invisible, a false one gets caught downstream.
    also_fixed: >
      --require-archetype-match was declared action=store_true with default=True and could never be
      turned off from the CLI.

  collector:
    file: collectors/collect_newborn.py
    runner: collectors/run_newborn.sh
    lanes: "discovery 900 s · follow 300 s · newborn window 6 h · cohort cap 480/slot"
    cold_start_rule: >
      The first discovery pass per venue records everything as seeded=1, never as a birth (measured:
      95,811 Kalshi + 4,474 PM on a cold start), and seeded rows never enter the follow cohort.
      Without this the first cycle queues ~100k book requests and the age axis is meaningless.
    validated_live: >
      92 genuine PM births detected in one pass. Denominator discipline held under total failure:
      92 markets -> 92 BOOK_ERROR rows, zero silent absences.
    bugs_found_and_fixed_during_bring_up:
      - "privacy denylist matched bare English -- `secret` rejected 83 legitimate markets, every
         'next Secretary General of NATO' contract. Rewritten to match identifier SHAPES."
      - "PM books are keyed by CLOB TOKEN id, not conditionId; sending the conditionId failed
         92/92. births now carries book_key."
