        - "named contract month (Kalshi 'October 2026') vs 'Active Month' (PM) on WTI"
        - "daily SETTLEMENT price (Kalshi) vs 1-minute candle High/Low (PM) on WTI"
      scope_caveat: "non-sports only. Sports (52,612 Kalshi markets) is excluded and is where
