        pages / 2.0 GB and was killed before terminating. Analysis ran on 587,450 unique cached
        markets (0 unparseable, 220 rejected all NO_EXPIRATION_VALUE, ZERO RULES_NOT_BRTI).
        Completeness is evidenced but not proven; stated in results.json and verdict.md.
