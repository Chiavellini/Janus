      test_looks_spent: 0
      verdict: "INSUFFICIENT_COVERAGE -- 2 settled meetings recoverable (26JUN, 26JUL) vs a pre-registered gate of 5; external comparison NOT_REACHED"
      pair_status: "BLOCK (UNCHANGED)"
