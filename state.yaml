phase2_cost_pins:
  source_of_truth: lib/fees/registry.py
  supersedes: lib/venue_costs.py    # frozen as the regression anchor, not extended
  note: >
    Per-market payload values ALWAYS win over the pins. Kalshi exposes fee_type/fee_multiplier per
    series; Polymarket exposes feeSchedule per market. An unknown venue RAISES rather than
    defaulting to zero.
  screening_form: "k * p * (1-p) -- all three fee families collapse to this for a cross-venue hedge"
  screening_coefficients:
    0.0700: [kalshi_taker, polymarket_crypto]
    0.0500: [betfair_base, polymarket_sports]
    0.0350: [kalshi_index_series]           # S&P/NASDAQ, multiplier 0.5
    0.0200: [smarkets, matchbook, sporttrade, betfair_max_discount]
    0.0175: [kalshi_maker]
    0.0000: [polymarket_maker, sxbet_singles, sportsbooks]   # embedded vig, NOT free
  two_leg_fee_floor_at_the_money_cents:
    kalshi_pm_crypto: 3.75       # phase 1's pair -- the MOST EXPENSIVE available
    kalshi_pm_sports: 3.25
    kalshi_smarkets: 2.50
    kalshi_pinnacle: 2.00
    pm_sports_smarkets: 1.75
    smarkets_sporttrade: 1.00
    smarkets_pinnacle: 0.50
    ratio_worst_to_best: 7.5
  polymarket_rate_correction: >
    PM's rate is PER-MARKET and the pinned 0.07 is the MINORITY case. Measured live distribution:
    0.04 -> 1,262 markets, 0.07 -> 372, 0.05 -> 336, none -> 130. match/screen.py:66 applied 0.07
    unconditionally, understating PM edges corpus-wide -- a bias toward "no edge", which is the
    more dangerous direction.
  unverified_pins:
    venues: [betfair, matchbook, sporttrade, sxbet, pinnacle, circa, forecastex, robinhood]
    rule: >
      RESEARCHED, not measured, and labelled verified_utc: unverified in the registry. Nothing
      resting on these may be promoted without a direct check against a real fill. Matchbook's
      sources conflict (2% / 1.5% / 0.75%) and it is pinned at the WORST cited value.

phase2_settlement_reference_rule:
  rule: >
    Never compare two prices without first measuring the basis between their settlement
    references, REGARDLESS OF VENUE. This supersedes the narrower "never mix venue series" in
    AGENTS.md, which reads as a venue rule when the real hazard is a settlement-reference one:
    Kalshi 15m crypto settles on BRTI, 15m commodities on Pyth, dailies possibly on a futures
    curve point -- so an INTRA-venue comparison can be the identical category error.
  unmeasured_basis: BLOCK    # never zero

